      <label><input type="checkbox" data-cfg="conf" ${db.cfg.conf?"checked":""}> Perguntar, após cada resposta, se você sabia ou chutou
        <span class="meta">Opcional. Serve para separar o que você domina do que acertou por sorte; aparece no Desempenho.</span></label></div>
    <div class="card"><p>Todo o seu progresso, questões adicionadas, edições e relatos ficam salvos apenas neste navegador. Exporte de vez em quando para não perder nada ao trocar de aparelho ou limpar o navegador.</p>
      <div class="meta">Guardado agora: ${db.added.length} questões adicionadas · ${Object.keys(db.edits).length} edições · ${db.reports.length} relatos · ${Object.keys(db.stats).length} questões com histórico · ${db.flags.length} sinalizadas</div>
      <div class="acoes"><button class="primary" data-act="exportar">Exportar backup (.json)</button></div>
      <p class="meta">As figuras coladas vão junto no arquivo, o que pode deixá-lo grande.</p></div>
    <div class="card"><label><span>Importar backup — cole o conteúdo do arquivo</span><textarea class="mono" data-f="imp"></textarea></label>
      <div class="acoes"><button data-act="importar">Importar e mesclar</button></div>
      <p class="meta">A importação soma ao que já existe: questões e relatos são acrescentados, e o histórico de acertos prevalece o de maior número de respostas.</p></div>${msgBox()}`}

const VIEWS={entrar:vEntrar,home:vHome,disc:vDisc,quiz:vQuiz,stats:vStats,add:vAdd,rel:vRel,banco:vBanco,edit:vEdit,relatos:vRelatos,dados:vDados};
let ultView="";
function render(){
  const y=scrollY,mesma=ultView===st.view;
  $("app").innerHTML=(VIEWS[st.view]||vHome)();
  document.body.classList.toggle("gabOn",st.gab);
  document.body.classList.toggle("uma",!!st.umaQ&&st.view==="quiz");
  const tm=db.cfg.tema;
  if(tm)document.documentElement.setAttribute("data-theme",tm);else document.documentElement.removeAttribute("data-theme");
  ultView=st.view; if(mesma)scrollTo(0,y); else scrollTo(0,0);
  pintarImagens();
  salvarSessao();
}

/* ============ captura de formulários ============ */
function colher(){document.querySelectorAll("[data-f]").forEach(el=>{
  const k=el.dataset.f,v=el.type==="checkbox"?el.checked:el.value;
  if(k==="qtd")st.qtd=v;else if(k==="busca")st.busca=v;else st.form[k]=v})}

function baixar(nome,txt,tipo){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([txt],{type:tipo||"text/plain;charset=utf-8"}));
  a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function copiar(t){if(navigator.clipboard)navigator.clipboard.writeText(t).catch(()=>{})}

/* ============ ações ============ */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act;colher();
  if(a==="resp"){responder(+el.dataset.q,+el.dataset.i);return}
  if(a==="conf"){marcarConfianca(+el.dataset.q,el.dataset.v);return}
  switch(a){
    case "enviarLink":enviarLink();break;
    case "confirmarCodigo":confirmarCodigo();break;
    case "sair":sair();break;
    case "home":st.view="home";st.msg="";break;
    case "disc":st.view="disc";st.disc=el.dataset.d;st.sel=new Set();st.msg="";break;
    case "stats":st.view="stats";st.msg="";break;
    case "banco":st.view="banco";st.msg="";break;
    case "relatos":st.view="relatos";st.msg="";break;
    case "dados":st.view="dados";st.msg="";break;
    case "add":st.view="add";st.msg="";break;
    case "aba":st.abaAdd=el.dataset.k;st.msg="";break;

    case "tsel":{const g=grupos(st.disc)[el.dataset.k]||{};
      Object.keys(g).forEach(s=>{const k=chave(el.dataset.k,s);el.checked?st.sel.add(k):st.sel.delete(k)});break}
    case "ssel":{const k=el.dataset.k;el.checked?st.sel.add(k):st.sel.delete(k);break}
    case "praticar":st.sel=new Set([el.dataset.k]);return iniciar(selecionadas(st.disc));
    case "praticarPri":st.disc=el.dataset.d;st.sel=new Set([el.dataset.k]);st.filtro="todas";return iniciar(selecionadas(st.disc));
    case "iniciar":return iniciar(selecionadas(st.disc));
    case "glob":st.disc=null;st.sel=new Set();st.filtro="todas";st.msg="";return iniciar(QS.filter(pred[el.dataset.f]),0);
    case "gab":st.gab=!st.gab;break;
    case "erros":return iniciar(st.S.lista.filter((q,i)=>st.S.resp[i]===false),0,true);
    case "flag":{const id=el.dataset.id;
      db.flags=db.flags.includes(id)?db.flags.filter(x=>x!==id):db.flags.concat(id);gravar();break}
    case "rel":st.rel=relatorio();st.view="rel";break;
    case "voltarQuiz":st.view="quiz";break;
    case "baixarRel":baixar("relatorio_estudo.txt",relTexto(st.rel));return;
    case "imprimir":print();return;

    /* relatos */
    case "rep":st.repQ=st.repQ===el.dataset.cod?null:el.dataset.cod;st.form.repTxt="";break;
    case "repFechar":st.repQ=null;break;
    case "repSalvar":{
      const txt=(st.form.repTxt||"").trim();
      if(!txt){st.msg="Descreva o problema antes de enviar.";break}
      db.reports.push({cod:el.dataset.cod,tipo:st.form.repTipo||"transc",txt,
        data:new Date().toLocaleString("pt-BR"),ok:false});
      gravar();st.repQ=null;st.form.repTxt="";
      st.msg=`Relato registrado para ${el.dataset.cod}. Veja em "Problemas relatados", na tela inicial.`;break}
    case "repToggle":{const r=db.reports[+el.dataset.i];if(r){r.ok=!r.ok;gravar()}break}
    case "repDel":{db.reports.splice(+el.dataset.i,1);gravar();break}
    case "copiarRelatos":{
      copiar("PROBLEMAS NAS QUESTÕES\n\n"+db.reports.map(r=>{const q=POR_COD[r.cod];
        return `[${r.cod}] ${TIPOS[r.tipo]||r.tipo}${r.ok?" (resolvido)":""}\n${r.txt}\n`
          +(q?`Enunciado atual: ${q.enun.slice(0,200)}\nAlternativas: ${q.alts.map((x,i)=>LET[i]+") "+x).join(" | ")}\nGabarito atual: ${q.gab}\n`:"")}).join("\n"));
      st.msg="Lista copiada. Cole na conversa comigo e eu devolvo as correções.";break}

    /* edição */
    case "edit":st.volta=["quiz","relatos","banco"].includes(st.view)?st.view:"banco";st.editId=el.dataset.id;st.view="edit";st.form={};st.msg="";break;
    case "editSalvar":{
      const q=POR_ID[el.dataset.id],f=st.form;
      const alts=(f.eAlts!==undefined?f.eAlts:q.alts.join("\n")).split(/\n/).map(s=>s.trim()).filter(Boolean);
      if(alts.length<2){st.msg="A questão precisa de pelo menos 2 alternativas.";break}
      const gab=f.eGab||q.gab;
      if(LET.indexOf(gab)>=alts.length){st.msg=`Gabarito ${gab} não existe: há só ${alts.length} alternativas.`;break}
      const enun=(f.eEnun!==undefined?f.eEnun:q.enun).trim();
      if(!enun){st.msg="O enunciado não pode ficar vazio.";break}
      const patch={disc:f.eDisc||q.disc,tema:(f.eTema!==undefined?f.eTema:q.tema).trim()||"Geral",
        subtema:(f.eSub!==undefined?f.eSub:q.subtema).trim()||"Geral",enun,alts,gab,
        anulada:f.eAnul!==undefined?!!f.eAnul:q.anulada,fig:(f.eFig!==undefined?f.eFig:q.fig||"").trim()||null,
        banca:(f.eBanca!==undefined?f.eBanca:q.banca||"").trim(),ano:(f.eAno!==undefined?f.eAno:q.ano||"").toString().trim()};
      if(q.seq){const i=db.added.findIndex(x=>x.id===q.id);if(i>=0)db.added[i]={...db.added[i],...patch}}
      else db.edits[q.id]={...(db.edits[q.id]||{}),...patch};
      gravar();construir();
      /* reflete a edição na sessão aberta */
      st.S.lista=st.S.lista.map(x=>x.id===q.id?{...POR_ID[q.id],opcoes:x.opcoes}:x);
      st.form={};st.msg=`${q.cod} atualizada.`;st.view=st.volta==="quiz"?"quiz":(st.volta||"banco");break}
    case "editReset":{const q=POR_ID[st.editId];delete db.edits[q.id];gravar();construir();
      st.form={};st.msg=`Edições de ${q.cod} desfeitas.`;break}
    case "editExcluir":{const q=POR_ID[el.dataset.id];
      if(!confirm(`Excluir definitivamente a questão ${q.cod}?`))break;
      db.added=db.added.filter(x=>x.id!==q.id);delete db.stats[q.id];delete db.sched[q.id];
      db.flags=db.flags.filter(x=>x!==q.id);gravar();construir();
      st.msg=`${q.cod} excluída.`;st.view="banco";break}

    /* importação */
    case "impLote":case "impJson":{
      const txt=((a==="impLote"?st.form.lote:st.form.json)||"").trim();
      if(!txt){st.msg="Cole o conteúdo antes de conferir.";break}
      const r=a==="impLote"?parseLote(txt):parseJSON(txt);
      if(r.erros.length){st.msg=(r.out.length?`${r.out.length} questão(ões) válidas, mas há problemas — nada foi adicionado. `:"Nada foi adicionado. ")+r.erros.slice(0,6).join(" · ");break}
      const cods=salvarNovas(r.out);
      if(a==="impLote")st.form.lote="";else st.form.json="";
      st.msg=`${cods.length} questão(ões) adicionada(s): ${cods.join(", ")}.`;break}
    case "impForm":{
      const f=st.form,alts=(f.fAlts||"").split(/\n/).map(s=>s.trim()).filter(Boolean);
      if(!(f.fEnun||"").trim()){st.msg="Escreva o enunciado.";break}
      if(alts.length<2){st.msg="Escreva pelo menos 2 alternativas, uma por linha.";break}
      const gab=f.fGab||"A";
      if(LET.indexOf(gab)>=alts.length){st.msg=`Gabarito ${gab} não existe: há só ${alts.length} alternativas.`;break}
      const cods=salvarNovas([{disc:f.fDisc||"cm",tema:(f.fTema||"Geral").trim(),subtema:(f.fSub||f.fTema||"Geral").trim(),
        enun:f.fEnun.trim(),alts,gab,anulada:!!f.fAnul,fig:(f.fFig||"").trim()||null,
        banca:(f.fBanca||"").trim(),ano:(f.fAno||"").trim()}]);
      st.form={fDisc:f.fDisc,fTema:f.fTema,fSub:f.fSub,fBanca:f.fBanca,fAno:f.fAno};   /* mantém o contexto */
      st.msg=`Questão ${cods[0]} adicionada. Os campos de tema foram mantidos para a próxima.`;break}
    case "copiarModelo":copiar(MODELO_LOTE);st.msg="Modelo copiado.";break;

    /* backup */
    case "exportar":{
      const usadas=QS.map(q=>q.fig).filter(f=>f&&f.startsWith("img:")).map(f=>f.slice(4));
      Promise.all(usadas.map(k=>imgGet(k).then(v=>[k,v]))).then(pares=>{
        const imgs={};pares.forEach(([k,v])=>{if(v)imgs[k]=v});
        baixar("backup_questoes_"+new Date().toISOString().slice(0,10)+".json",
          JSON.stringify({...db,imgs}),"application/json")}).catch(()=>{
        baixar("backup_questoes.json",JSON.stringify(db),"application/json")});
      return}
    case "importar":{
      let x;try{x=JSON.parse(st.form.imp||"")}catch(err){st.msg="Arquivo inválido: "+err.message;break}
      if(!x||typeof x!=="object"){st.msg="Arquivo inválido.";break}
      (x.added||[]).forEach(q=>{if(!db.added.some(y=>y.id===q.id)){q.seq=++db.seq;db.added.push(q)}});
      Object.assign(db.edits,x.edits||{});
      (x.reports||[]).forEach(r=>{if(!db.reports.some(y=>y.cod===r.cod&&y.txt===r.txt))db.reports.push(r)});
      Object.entries(x.stats||{}).forEach(([k,v])=>{const c=db.stats[k];if(!c||v.t>c.t)db.stats[k]=v});
      Object.entries(x.sched||{}).forEach(([k,v])=>{if(!db.sched[k])db.sched[k]=v});
      db.flags=[...new Set(db.flags.concat(x.flags||[]))];
      (x.sessoes||[]).forEach(s=>{if(!db.sessoes.some(y=>y.id===s.id))db.sessoes.push(s)});
      if(x.cfg)db.cfg=Object.assign(db.cfg,x.cfg);
      Object.entries(x.imgs||{}).forEach(([k,v])=>{imgPut(k,v).catch(()=>{});IMGC.set(k,v)});
      gravar();construir();st.form.imp="";st.msg="Backup importado e mesclado.";break}
    case "praticarUma":{const q=POR_ID[el.dataset.id];st.disc=q.disc;st.sel=new Set();st.filtro="todas";return iniciar([q])}
    case "imgLimpar":{const k=st.form[el.dataset.alvo]||"";
      if(k.startsWith("img:")){imgDel(k.slice(4)).catch(()=>{});IMGC.delete(k.slice(4))}
      st.form[el.dataset.alvo]="";st.msg="Figura removida.";break}
    case "tema":{const o=["","light","dark"];db.cfg.tema=o[(o.indexOf(db.cfg.tema||"")+1)%3];gravar();break}
    case "cron":st.disc=null;st.sel=new Set();st.filtro="todas";return iniciar(QS.slice(),+el.dataset.m);
    case "retomar":{const S=sessaoAtiva();if(!S)break;st.view="quiz";iniciarRelogio();
      if(S.fim&&Date.now()>=S.fim){encerrarSessao("tempo");return}break}
    case "descartar":if(confirm("Descartar a sessão em andamento? As respostas já dadas continuam no histórico.")){
      st.S={lista:[],resp:{},esc:{},conf:{},causa:{},inicio:0,dur:0,fim:0,prova:false,encerrada:true,cur:0,rotulo:""};limparSessaoSalva()}break;
    case "causa":{const S=st.S,i=+el.dataset.q,k=el.dataset.k,q=S.lista[i];
      if(q&&S.resp[i]===false&&S.causa[i]===undefined){S.causa[i]=k;
        const s=db.stats[q.id]||{t:0,a:0};s.c=s.c||{};s.c[k]=(s.c[k]||0)+1;db.stats[q.id]=s;gravar()}break}
    case "umaQ":st.umaQ=!st.umaQ;break;
    case "telaCheia":{const de=document.documentElement;
      if(document.fullscreenElement){document.exitFullscreen&&document.exitFullscreen()}
      else if(de.requestFullscreen){de.requestFullscreen().catch(()=>{st.msg="Tela cheia não disponível neste navegador."})}
      break}
    case "navQ":navQ(+el.dataset.d);return;
    case "encerrar":encerrarSessao("manual");return;
    case "baixarModelo":baixar("planilha_modelo_questoes.csv",CSV_MODELO,"text/csv;charset=utf-8");return;
    case "conferirArq":conferir();return;
    case "gravarArq":gravarPrevia();return;
    case "cancelarPrevia":st.previa=null;break;
    case "limparArq":st.impTxt="";st.impTxtNome="";st.impImg={};st.previa=null;break;
    case "buscar":break;
    case "limparBusca":st.busca="";break;
    case "zerar":if(confirm("Apagar todo o histórico de acertos e a programação de revisões?")){
      db.stats={};db.sched={};gravar();st.msg="Histórico zerado."}break;
  }
  render();
});

/* mudanças que precisam redesenhar na hora (filtro, duração, banca, planilha, ajustes) */
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset||{};
  if(d.fileMany!==undefined){receberArquivos([...t.files]);return}
  if(d.cfg){db.cfg[d.cfg]=t.type==="checkbox"?t.checked:t.value;gravar();render();return}
  if(d.file){const f=t.files&&t.files[0];if(f){colher();guardarImagem(f,d.file)}return}
  if(d.ch){colher();
    const k=d.ch;
    if(k==="filtro")st.filtro=t.value;
    if(k==="ordem")st.ordem=t.value;
    if(k==="banca")st.banca=t.value;
    if(k==="ano")st.ano=t.value;
    if(k==="dur")st.dur=t.value;
    if(k==="feedback")st.feedback=t.value==="1";
    render()}});
/* colar, arrastar e soltar imagens */
const alvoImagem=()=>st.view==="edit"?"eFig":(st.view==="add"&&st.abaAdd==="form")?"fFig":null;
document.addEventListener("paste",e=>{
  const alvo=alvoImagem();if(!alvo)return;
  const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(x=>x.type.startsWith("image/"));
  if(!it)return;
  e.preventDefault();colher();guardarImagem(it.getAsFile(),alvo)});
document.addEventListener("dragover",e=>{const z=e.target.closest&&e.target.closest("[data-drop]");
  if(z){e.preventDefault();z.classList.add("over")}});
document.addEventListener("dragleave",e=>{const z=e.target.closest&&e.target.closest("[data-drop]");if(z)z.classList.remove("over")});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest("[data-drop]");
  if(!z)return;e.preventDefault();z.classList.remove("over");
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(f){colher();guardarImagem(f,z.dataset.drop)}});

/* atalhos de teclado durante a sessão */
document.addEventListener("keydown",e=>{
  if(st.view!=="quiz"||!sessaoAtiva()||!db.cfg.teclado||e.ctrlKey||e.metaKey||e.altKey)return;
  const tag=(e.target.tagName||"").toUpperCase();
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const S=st.S,k=e.key.length===1?e.key.toUpperCase():e.key;
  if(st.umaQ&&(k==="ArrowRight"||k==="ArrowLeft")){e.preventDefault();navQ(k==="ArrowRight"?1:-1);return}
  const i=st.umaQ?S.cur:porResponder();
  if(LET.includes(k)){
    if(i<0||S.resp[i]!==undefined)return;
    const j=LET.indexOf(k);
    if(j<S.lista[i].opcoes.length){e.preventDefault();responder(i,j)}return}
  if(k==="G"&&!S.prova){e.preventDefault();st.gab=!st.gab;render();return}
  if(k==="M"){const j=st.umaQ?S.cur:(i<0?S.lista.length-1:i);const q=S.lista[j];if(!q)return;
    e.preventDefault();db.flags=db.flags.includes(q.id)?db.flags.filter(x=>x!==q.id):db.flags.concat(q.id);
    gravar();render();return}
  if(db.cfg.conf&&!S.prova&&(k==="1"||k==="2")){
    const j=S.lista.findIndex((q,n)=>S.resp[n]!==undefined&&!S.conf[n]);
    if(j>=0){e.preventDefault();marcarConfianca(j,k==="1"?"s":"c")}return}
  if(k==="N"||k===" "||k==="Enter"){
    if(st.umaQ){e.preventDefault();navQ(1);return}
    if(i>=0){e.preventDefault();const el=document.getElementById("qc"+i);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}}});
/* contagem de alternativas e seletor de gabarito mudam sem redesenhar a tela */
document.addEventListener("input",e=>{
  const el=e.target,d=el.dataset;if(!d||!d.gabsel)return;
  const n=el.value.split(/\n/).filter(s=>s.trim()).length;
  const cnt=document.querySelector(`[data-cnt="${d.cntalvo}"]`);if(cnt)cnt.textContent=n;
  const sel=document.querySelector(`[data-f="${d.gabsel}"]`);
  if(sel){const atual=sel.value,novo=LET.slice(0,Math.max(n,2));
    if(sel.options.length!==novo.length){
      sel.innerHTML=novo.map(x=>`<option value="${x}">${x}</option>`).join("");
      sel.value=novo.includes(atual)?atual:novo[0]}}});

  if(el)el.textContent={ok:"☁ sincronizado",pendente:"☁ pendente: envia quando houver conexão",carregando:"☁ carregando…",erro:"☁ sem conexão com a nuvem",local:""}[s]||""}

async function lerNuvem(){
  const {data:p,error:e1}=await sb.from("progresso").select("dados").eq("user_id",usuario.id).maybeSingle();
  if(e1)throw e1;
  let linhas=[],ini=0;
  for(;;){
    const {data,error}=await sb.from("questoes").select("id,dados").eq("user_id",usuario.id).order("id").range(ini,ini+999);
    if(error)throw error;
    linhas=linhas.concat(data||[]);
    if(!data||data.length<1000)break;
    ini+=1000}
  return {progresso:p?p.dados:null,linhas}}

function aplicarNuvem(c){
  const pr=c.progresso||{};
  Object.assign(db,{stats:pr.stats||{},sched:pr.sched||{},flags:pr.flags||[],reports:pr.reports||[],edits:pr.edits||{},
    seq:pr.seq||0,sessoes:pr.sessoes||[],cfg:Object.assign({conf:false,teclado:true,tema:""},pr.cfg||{})});
  db.added=c.linhas.map(r=>({...r.dados,id:r.id}));
  db.added.forEach(q=>{if(!q.seq)q.seq=++db.seq;if(!q.cod)q.cod=(PRE[q.disc]||"CM")+"-A"+String(q.seq).padStart(2,"0")});
  ultimoSalvo=new Map(db.added.map(q=>[q.id,JSON.stringify(q)]));
  progSalvo=JSON.stringify(progDe(db))}

async function salvarNuvem(){
  if(!sb||!usuario||!nuvem.carregado)return;
  if(!navigator.onLine){setSync("pendente");return}
  try{
    const pj=JSON.stringify(progDe(db));
    if(pj!==progSalvo){const {error}=await sb.from("progresso").upsert({user_id:usuario.id,dados:progDe(db)});if(error)throw error;progSalvo=pj}
    const vistos=new Set(),mudar=[];
    for(const q of db.added){vistos.add(q.id);const j=JSON.stringify(q);
      if(ultimoSalvo.get(q.id)!==j)mudar.push({user_id:usuario.id,id:q.id,dados:q,_j:j})}
    for(let i=0;i<mudar.length;i+=400){
      const {error}=await sb.from("questoes").upsert(mudar.slice(i,i+400).map(({_j,...r})=>r));if(error)throw error}
    mudar.forEach(r=>ultimoSalvo.set(r.id,r._j));
    for(const id of [...ultimoSalvo.keys()])if(!vistos.has(id)){
      const {error}=await sb.from("questoes").delete().eq("id",id);if(error)throw error;ultimoSalvo.delete(id)}
    setSync("ok")
  }catch(e){setSync("pendente")}}

async function entrarComSessao(u){
  if(usuario&&usuario.id===u.id)return;
  usuario=u;setSync("carregando");
  try{
    const c=await lerNuvem();
    if(!c.progresso&&c.linhas.length===0){
      nuvem.carregado=true;ultimoSalvo=new Map();progSalvo="";
    }else{aplicarNuvem(c);nuvem.carregado=true}
    construir();gravar();
    if(st.view==="entrar")st.view="home";
    render();setSync("ok");
    salvarNuvemFila();
  }catch(e){
    usuario=null;nuvem.carregado=false;setSync("erro");
    st.view="home";st.msg="Não consegui carregar seus dados da nuvem. Você pode usar o que já está neste aparelho, mas nada será enviado até conectar.";
    render()}}

async function iniciarNuvem(){
  if(!sb){setSync("local");return}
  window.addEventListener("online",()=>{if(usuario)salvarNuvemFila()});
  sb.auth.onAuthStateChange((ev,s)=>{
    if(s&&s.user){if(!usuario||usuario.id!==s.user.id)entrarComSessao(s.user)}
    else if(ev==="SIGNED_OUT"){usuario=null;nuvem.carregado=false;st.view="entrar";render()}});
  const {data}=await sb.auth.getSession();
  if(data&&data.session)await entrarComSessao(data.session.user);
  else{st.view="entrar";render()}}

async function enviarLink(){
  const email=String(st.form.emailLogin||"").trim();
  if(!/^\S+@\S+\.\S+$/.test(email)){st.msg="Digite um e-mail válido.";render();return}
  if(!sb){st.msg="Sem conexão com o servidor. Tente de novo com internet.";render();return}
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
  st.form.emailEnviado=email;
  st.loginEtapa="codigo";
  st.msg=error?"Não consegui enviar o link: "+error.message:"Enviei para "+email+". Se o e-mail trouxer um código de 6 dígitos, digite-o abaixo. Se trouxer só um link, toque nele.";
  render()}

async function confirmarCodigo(){
  const token=String(st.form.codigo||"").replace(/\s/g,"");
  const email=st.form.emailEnviado||String(st.form.emailLogin||"").trim();
  if(!/^\d{6,8}$/.test(token)){st.msg="Digite o código de 6 dígitos que chegou no e-mail.";render();return}
  if(!sb){st.msg="Sem conexão com o servidor.";render();return}
  const {data,error}=await sb.auth.verifyOtp({email,token,type:"email"});
  if(error||!data||!data.session){st.msg="Código inválido ou vencido. Peça um novo link.";render();return}
  st.loginEtapa=null;st.msg="";
  await entrarComSessao(data.session.user);
  render()}

async function sair(){
  if(!confirm("Sair deste aparelho? Confirme que suas últimas alterações já foram sincronizadas (indicador no canto da tela)."))return;
  if(sb)await sb.auth.signOut().catch(()=>{});
  try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+"_sessao");localStorage.removeItem(KEY+"_added")}catch(e){}
  try{await kvPut("added",[])}catch(e){}
  location.reload()}
