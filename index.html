  /* 1. revisões vencidas (até 50% da meta), ordenadas por categoria e atraso proporcional */
  const venc=lista.filter(m=>{const e=db.ideias[m.k];return e&&e.cal&&e.due<=agora}).map(m=>{const e=db.ideias[m.k];
    return{m,cat:e.ce?0:ordemPrioridadeRevisao[e.e]??4,atraso:(agora-e.due)/DIA/Math.max(1,MC.degraus[e.deg])}}).sort((a,b)=>a.cat-b.cat||b.atraso-a.atraso);
  const maxRev=Math.floor(meta*MC.limiteRevisoes);let nRev=0;

  /* 2. ideias em aprendizado */

  /* 3. ideias novas (até 15/dia) */

function intercalar(itens,pref){const porMat={};itens.forEach(it=>(porMat[it.mat]=porMat[it.mat]||[]).push(it));

function paresDe(p){const mats=p.materias.slice().sort((a,b)=>(b.gosto||3)-(a.gosto||3));

function gerarCronogramaMotor(p){const pares=paresDe(p),out=[];if(!pares.length)return out;
  const hoje=new Date();hoje.setHours(0,0,0,0);let ci=0;const fim=p.dataProva?Math.min(p.semanas*7,Math.max(7,diasAteProva(p)||0)):p.semanas*7;
  for(let d=0;d<fim;d++){const dt=new Date(hoje.getTime()+d*DIA);if(!p.dias.includes(dt.getDay()))continue;

    let pesos=par.map(m=>m.k?pesoMateria(m,p)*(MC.multiplicador[nivelMateria(m)]||3):1);let tot=pesos.reduce((a,b)=>a+b,0);

/* ============================================================
   CURVAS DE RETENÇÃO — por subtópico (assunto), tópico (tema) e matéria
   S=(19/81)·t/(r^-2−1); data = medição + intervalo até a retenção-alvo;
   tópico = média dos subtópicos; matéria = média dos tópicos.
   Tudo o que o módulo decide vai para db.curvaLog (administrador).

  const ideias=Object.values(ideiasDe(l));const Rs=ideias.map(x=>{const e=db.ideias[x.k];return(!e||!e.ultU)?MC.unificado.rNaoVista:Rh((agora-e.ultU)/DIA,e.h||1)});
  const R=Rs.reduce((a,b)=>a+b,0)/Rs.length;const porTema={};pool.forEach(q=>porTema[temaDe(q)]=(porTema[temaDe(q)]||0)+1);const peso=l.length/Math.max(1,...Object.values(porTema));
  return{...pontuacaoPrioridade(acc,R,peso),acc,R,pesoBruto:peso,n:l.length,nome:DISC[l[0].disc]+" › "+l[0].tema}}
function prioridadesDoPool(pool){return [...new Set(pool.map(temaDe))].map(tk=>({tk,...prioridadeTema(tk,pool)})).sort((a,b)=>b.total-a.total)}
/* EPC do projeto */
function epcProjeto(p){const pool=poolDe(p.materias.filter(m=>m.k)).filter(q=>!incompleta(q));if(!pool.length)return null;
  const ids=new Set(pool.map(q=>q.id));const n=db.attempts.filter(a=>ids.has(a.q)).length;if(n<MC.unificado.epc.minRespostas)return{faltam:MC.unificado.epc.minRespostas-n,n};
  const porTema={};pool.forEach(q=>porTema[temaDe(q)]=(porTema[temaDe(q)]||0)+1);
  const itens=pool.map(q=>{const pr=PDe(q,Date.now(),p);return{w:(p.pesosTema&&p.pesosTema[q.tema])||1/porTema[temaDe(q)]*Math.sqrt(porTema[temaDe(q)]),R:pr.R,theta:pr.theta,b:pr.b,g:pr.g,se:pr.se}});
  const r=epcDe(itens,120);return{...r,n,chance:p.corte?Math.round(chanceAcimaCorte(r.epc,p.corte,r.sd)*100):null}}
/* alertas de queda (EWMA diário por tema) */
function alertasQueda(pool){const ids=new Set(pool.map(q=>q.id)),desde=Date.now()-60*DIA,porT={};
  db.attempts.filter(a=>ids.has(a.q)&&a.fim>=desde).forEach(a=>{(porT[a.tm]=porT[a.tm]||{});const d=porT[a.tm][a.dia]||(porT[a.tm][a.dia]={ok:0,n:0});d.n++;if(a.ok&&!a.ch)d.ok++});
  return Object.entries(porT).map(([tk,dias])=>{const serie=Object.entries(dias).sort().map(([dia,d])=>({dia,acc:d.ok/d.n,n:d.n}));const r=alertaQueda(serie);if(!r.alerta)return null;const q=pool.find(x=>temaDe(x)===tk);return{tk,nome:q?DISC[q.disc]+" › "+q.tema:tk,...r.alerta}}).filter(Boolean)}
/* calibração do modelo (administrador) */
function calibracaoModelo(){const l=db.attempts.filter(a=>a.P!==undefined).slice(-500).map(a=>({P:a.P,y:(a.ok&&!a.ch)?1:0}));return{n:l.length,...calibracao(l)}}

/* ============================================================
   ESTRUTURA DE CONHECIMENTO — átomos, grafo, mapa de desenvolvimento,
   eventos devolvidos à base e painel do administrador.
   O app não edita átomos: importa o pacote export/<MATERIA>/ e devolve eventos.
   ============================================================ */
const EST_CFG={aprendido:3,alvoPadrao:0.8,fraco:0.6,confusaoMin:0.6,parDist:[3,8],leitor:{estrela:1,neutro:0.5,pular:0,dificil:0.75},pesoBanca:0.5,maxRegras:0.3,maxEventos:4000,maxErros:40};
const ESTR={pacotes:{},atomos:{},alias:{},relIdx:{},arvore:{},resumos:{},lista:[],agregados:{},n:0};
const ATOM_HIST={};
const ARQ_PACOTE=["atomos","arvore","questoes","relacoes","resumos","lista_mestra","agregados"];
const temEstrutura=()=>ESTR.n>0;
/* códigos de matéria usados pelo extrator nos pacotes */
const COD_EXTRATOR={LP:"pt",POR:"pt",DIR:"dr",INF:"in",RLM:"rl",EAP:"ap",RED:"rd",ML:"lg"};
const codMateria=m=>{const s=String(m||"").trim();const up=s.toUpperCase();if(COD_EXTRATOR[up])return COD_EXTRATOR[up];const k=Object.keys(PRE).find(k=>PRE[k]===up);if(k)return k;if(DISC[s.toLowerCase()])return s.toLowerCase();return normDisc(s)};
const resolverAtomo=id=>{let x=id,g=0;while(ESTR.alias[x]&&g++<10)x=ESTR.alias[x];return x};
const atomoDe=id=>ESTR.atomos[resolverAtomo(id)]||null;
const atomoKeyIdeia=a=>"i:"+normTxt(a.ideia_central||a.subtopico||"");
const atomosDaQ=q=>(q.atomos||[]).map(l=>({...l,id:resolverAtomo(l.id),a:atomoDe(l.id)})).filter(l=>l.a&&l.a.status!=="excluido");
const atomoDecide=q=>{const l=atomosDaQ(q);return(l.find(x=>x.papel==="decide")||l[0]||{}).a||null};
const relsDe=id=>ESTR.relIdx[resolverAtomo(id)]||[];
const rotuloAtomo=id=>{const a=atomoDe(id);return a?(a.sujeito?a.sujeito+": ":"")+a.afirmacao:id};
const clamp01=x=>Math.max(0,Math.min(1,x));

/* ---------- construção dos índices ---------- */
function construirEstrutura(){
  ESTR.atomos={};ESTR.alias={};ESTR.relIdx={};ESTR.arvore={};ESTR.temaNomes={};ESTR.resumos={};ESTR.lista=[];ESTR.agregados={};ESTR.n=0;
  const rels=[];
  Object.entries(ESTR.pacotes).forEach(([d,p])=>{
    (p.atomos||[]).forEach(a=>{ESTR.atomos[a.id]=a;ESTR.n++;(a.aliases||[]).forEach(al=>{if(al&&al!==a.id)ESTR.alias[al]=a.id})});
    (p.relacoes||[]).forEach(r=>rels.push(r));
    {const tn={};Object.entries(p.arvore||{}).forEach(([c,tops])=>{const ks=Object.keys(tops||{});if(ks.length===1)tn[c]=ks[0]});ESTR.temaNomes[d]=Object.assign(tn,p.temaNomes||{})}
    if(p.arvore)ESTR.arvore[d]=p.arvore;if(p.resumos)ESTR.resumos[d]=p.resumos;if(p.agregados)ESTR.agregados[d]=p.agregados;
    if(p.lista)ESTR.lista=ESTR.lista.concat(p.lista.map(x=>({...x,disc:d})))});
  const visto=new Set();
  rels.forEach(r=>{const a=resolverAtomo(r.a),b=resolverAtomo(r.b);if(!ESTR.atomos[a]||!ESTR.atomos[b])return;const k=[a,b,r.tipo].join("|");if(visto.has(k))return;visto.add(k);
    (ESTR.relIdx[a]=ESTR.relIdx[a]||[]).push({...r,a,b,outro:b,souA:true});
    (ESTR.relIdx[b]=ESTR.relIdx[b]||[]).push({...r,a,b,outro:a,souA:false})});
  /* marcações e validações feitas sob ids antigos migram para o id atual */
  ["marcas","valid"].forEach(c=>{const m=db[c]||{};Object.keys(m).forEach(id=>{const n=resolverAtomo(id);if(n!==id){if(!m[n])m[n]=m[id];delete m[id]}})});
  construirAtomHist()}
function construirAtomHist(){for(const k in ATOM_HIST)delete ATOM_HIST[k];if(!temEstrutura())return;
  const porQ=indiceAtomosPorQ();db.attempts.forEach(a=>{const ids=porQ[a.q];if(ids)ids.forEach(id=>registrarAtomHist(id,a))})}
function indiceAtomosPorQ(){const m={};QS_TODAS.forEach(q=>{if(q.atomos&&q.atomos.length){const ids=atomosDaQ(q).map(l=>l.id);if(ids.length)m[q.id]=ids}});return m}
function atomHistAposTentativa(q,a){if(!temEstrutura()||!q.atomos||!q.atomos.length)return;atomosDaQ(q).forEach(l=>registrarAtomHist(l.id,a))}
function registrarAtomHist(id,a){const h=ATOM_HIST[id]||(ATOM_HIST[id]={n:0,ac:0,err:0,ch:0,lap:0,ult:0,foi:false,ults:[]});
  h.n++;const certo=a.ok&&!a.ch;
  if(certo){h.ac++;if(h.ac>=EST_CFG.aprendido)h.foi=true}else{if(a.ch)h.ch++;else h.err++;if(h.foi)h.lap++}
  h.ult=Math.max(h.ult,a.fim);h.ults.push(certo?1:0);if(h.ults.length>5)h.ults.shift()}

/* ---------- domínio, importância e prioridade por átomo ---------- */
const retencaoAlvo=p=>(p&&p.ajustes&&p.ajustes.retencao)||EST_CFG.alvoPadrao;
function estadoAtomo(id,p,agora){const h=ATOM_HIST[resolverAtomo(id)],a=atomoDe(id);agora=agora||Date.now();
  if(!h||!h.n)return{estado:"desconhecido",dominio:0,R:null,n:0,ac:0,err:0,ch:0,lap:0,ult:0};
  const e=a?db.ideias[atomoKeyIdeia(a)]:null,hmv=(e&&e.h)||MC.unificado.hInicial,R=Rh((agora-h.ult)/DIA,hmv),alvo=retencaoAlvo(p);
  if(h.ac>=EST_CFG.aprendido)return{estado:R>=alvo?"conhecido":"esquecido",dominio:R,R,R2:Rh((agora-h.ult)/DIA+2,hmv),h:hmv,...h};
  return{estado:"aprendendo",dominio:(h.ac/h.n)*0.6,R,h:hmv,...h}}
let _freqBanca={};
function freqBanca(id,banca){const k=banca.toLowerCase();if(!_freqBanca[k]){const cont={},porD={};
    QS_TODAS.forEach(q=>{if(!q.atomos||String(q.banca||"").toLowerCase()!==k)return;atomosDaQ(q).forEach(l=>{cont[l.id]=(cont[l.id]||0)+1;const d=l.a.materia||q.disc;porD[d]=Math.max(porD[d]||0,cont[l.id])})});
    _freqBanca[k]={cont,porD}}
  const f=_freqBanca[k],a=atomoDe(id);if(!a)return null;const max=f.porD[a.materia]||f.porD[codMateria(a.materia)]||0;if(!max)return null;return(f.cont[resolverAtomo(id)]||0)/max}
function importanciaDe(id,p){const a=atomoDe(id);if(!a)return 0;const c=a.componentes_importancia||null,m=(db.marcas||{})[resolverAtomo(id)];
  let imp;
  if(c){let freq=c.freq_q!==undefined?c.freq_q:0.5;
    if(p&&p.banca){const fb=freqBanca(id,p.banca);if(fb!==null)freq=(1-EST_CFG.pesoBanca)*freq+EST_CFG.pesoBanca*fb}
    const leitor=m?EST_CFG.leitor[m]:(c.leitor!==undefined?c.leitor:0.5);
    imp=0.45*freq+0.25*leitor+0.20*(c.edital!==undefined?c.edital:0.5)+0.10*(c.enfase!==undefined?c.enfase:0.5)}
  else{imp=a.importancia!==undefined?a.importancia:0.5;if(m)imp=0.75*imp+0.25*EST_CFG.leitor[m]}
  if(/^(proposto|rever|pendente)$/.test(a.status||""))imp*=0.5;
  return clamp01(imp)}
const naoValidado=a=>!!a&&/^(proposto|rever|pendente)$/.test(a.status||"");
function prioridadeAtomo(id,p,agora){const e=estadoAtomo(id,p,agora),imp=importanciaDe(id,p),alvo=retencaoAlvo(p);
  const urg=e.estado==="esquecido"?1.5:(e.R!==null&&e.R>=alvo&&e.R2!==undefined&&e.R2<alvo)?1.2:1;
  return{total:imp*(1-e.dominio)*urg,imp,urg,...e}}
/* peso de uma questão para o motor: mistura o peso do tema com a importância dos átomos dela */
function pesoEstrutural(q,p,pesoTema){if(!temEstrutura()||!q.atomos||!q.atomos.length)return pesoTema;
  const l=atomosDaQ(q);if(!l.length)return pesoTema;const imp=Math.max(...l.map(x=>importanciaDe(x.id,p)));return 0.4*pesoTema+0.6*imp}
const impDaQ=(q,p)=>{const l=atomosDaQ(q);return l.length?Math.max(...l.map(x=>importanciaDe(x.id,p))):null};

/* ---------- eventos devolvidos à base ---------- */
function evento(e){db.eventos=db.eventos||[];db.eventos.push({ts:new Date().toISOString(),...e});if(db.eventos.length>EST_CFG.maxEventos)db.eventos.splice(0,db.eventos.length-EST_CFG.maxEventos)}
function marcarAtomo(id,v){id=resolverAtomo(id);db.marcas=db.marcas||{};if(v==="neutro"||db.marcas[id]===v)delete db.marcas[id];else db.marcas[id]=v;_freqBanca={};evento({tipo:"marcacao",atomo_id:id,marcacao:db.marcas[id]||"neutro"});gravar()}
function validarAtomo(id,decisao,motivos,nota){id=resolverAtomo(id);db.valid=db.valid||{};if(decisao==="ok")delete db.valid[id];else db.valid[id]={decisao,motivos:motivos||[],nota:nota||"",ts:Date.now()};
  evento({tipo:"validacao",atomo_id:id,decisao,motivos:motivos||[],nota:nota||""});gravar()}
function registrarLeitura(ids){const hoje=hojeISO();db.leituras=db.leituras||{};let n=0;ids.forEach(id=>{id=resolverAtomo(id);if(db.leituras[id]===hoje)return;db.leituras[id]=hoje;evento({tipo:"leitura",atomo_id:id});n++});if(n)gravar()}
function eventosJsonl(){const porQ=indiceAtomosPorQ(),L=[];
  db.attempts.forEach(a=>{const ids=porQ[a.q];if(!ids)return;ids.forEach(id=>L.push({ts:new Date(a.fim).toISOString(),tipo:"resposta",atomo_id:id,questao_id:a.q,sessao_id:a.s||"",resultado:a.ch?"chute":(a.ok?"acerto":"erro"),tempo_ms:a.t||0}))});
  (db.eventos||[]).forEach(e=>L.push(e));L.sort((x,y)=>x.ts<y.ts?-1:x.ts>y.ts?1:0);return L.map(l=>JSON.stringify(l)).join("\n")+"\n"}

/* ---------- importação do pacote ---------- */
/* lote no formato do extrator (pacote inteiro ou questões de revisão): entra direto pelo importador */
function lerJSONouJSONL(txt){try{return JSON.parse(txt)}catch(e){try{return String(txt).split(/\r?\n/).filter(l=>l.trim()).map(l=>JSON.parse(l))}catch(e2){return undefined}}}
const pareceItemExtrator=x=>!!x&&typeof x==="object"&&(Array.isArray(x.materias)||!!x.extras||x.gerada===true||/revis/i.test(String(x.origem_tipo||""))||(Array.isArray(x.alternativas)&&x.alternativas.length>0&&typeof x.alternativas[0]==="object"));
const CAMPOS_LOTE=["materia","rotulo","tipo_lote","origem_tipo","fonte","gerado_por"];
function loteDeObjeto(o,nome){if(!o||typeof o!=="object")return null;
  if(Array.isArray(o))return o.length&&o.every(x=>x&&x.enunciado)&&o.some(pareceItemExtrator)?{questoes:o,nomeArquivo:nome}:null;
  if(o.atomos||o.arvore||o.tipo_lote||(Array.isArray(o.questoes)&&o.questoes.some(pareceItemExtrator))){const u={};ARQ_PACOTE.concat(CAMPOS_LOTE).forEach(k=>{if(o[k]!==undefined)u[k]=o[k]});u.nomeArquivo=nome;return u}
  if(o.enunciado&&pareceItemExtrator(o))return{questoes:[o],nomeArquivo:nome};
  return null}
function tentarLote(txt,nome){const u=loteDeObjeto(lerJSONouJSONL(txt),nome||"");if(!u)return false;
  const r=importarPacote(u);st.msg=r.resumo+(r.erros.length?" · "+r.erros.slice(0,5).join(" · "):"");return true}
async function receberPacote(files){const p={};let erros=[],nImg=0;const inteiros=[];
  for(const f of files){if(/^image\//.test(f.type)||/\.(png|jpe?g|webp|gif)$/i.test(f.name)){try{const k=nomeArq(f.name),v=await reduzir(f);await imgPut(k,v);IMGC.set(k,v);nImg++}catch(e){erros.push(f.name+": imagem ilegível")}continue}
    const nome=f.name.toLowerCase().replace(/\.jsonl?$/,"");const o=lerJSONouJSONL(await f.text());if(o===undefined){erros.push(f.name+": JSON inválido");continue}
    if(ARQ_PACOTE.includes(nome))p[nome]=o;
    else if(loteDeObjeto(o,f.name))inteiros.push(loteDeObjeto(o,f.name));
    else if(Array.isArray(o)&&o[0]&&o[0].afirmacao)p.atomos=o;
    else if(Array.isArray(o)&&o[0]&&o[0].enunciado&&o[0].atomos)p.questoes=o;
    else erros.push(f.name+": não reconheci (esperava atomos, arvore, questoes, relacoes, resumos, lista_mestra ou agregados)")}
  const tImg=nImg?nImg+" imagem(ns) guardada(s) neste aparelho":"";
  const lotes=inteiros.concat(p.atomos||p.questoes?[p]:[]);
  if(!lotes.length){st.msg=(tImg?[tImg].concat(erros):erros).join(" · ")||"Nenhum arquivo do pacote.";render();return}
  const rs=lotes.map(importarPacote);st.msg=rs.map(r=>r.resumo).concat(tImg?[tImg]:[],erros,[].concat(...rs.map(r=>r.erros)).slice(0,5)).join(" · ");render()}
function importarPacote(p){const erros=[];
  const d=codMateria(p.materia||(p.atomos&&p.atomos[0]&&p.atomos[0].materia)||(p.questoes&&p.questoes[0]&&(p.questoes[0].materias||[])[0])||(p.lista_mestra&&p.lista_mestra[0]&&p.lista_mestra[0].materia));
  if(!d)return{resumo:"Matéria não reconhecida no pacote.",erros};
  const pac=ESTR.pacotes[d]||(ESTR.pacotes[d]={atomos:[],relacoes:[],arvore:null,resumos:null,lista:null,agregados:null});
  let nAt=0,nRel=0,nQ=0,nQnov=0;const motivos={};
  if(p.atomos){const porId=Object.fromEntries(pac.atomos.map(a=>[a.id,a]));p.atomos.forEach(a=>{if(!a.id||!a.afirmacao){erros.push("átomo sem id ou afirmação");return}porId[a.id]=a;nAt++});pac.atomos=Object.values(porId)}
  if(p.relacoes){const k=r=>[r.a,r.b,r.tipo].join("|");const porK=Object.fromEntries(pac.relacoes.map(r=>[k(r),r]));p.relacoes.forEach(r=>{if(!r.a||!r.b||!r.tipo)return;porK[k(r)]=r;nRel++});pac.relacoes=Object.values(porK)}
  if(p.questoes){const tn=pac.temaNomes||(pac.temaNomes={});p.questoes.forEach(x=>{if(x&&x.tema&&(x.tema_banco||x.topico))tn[x.tema]=x.tema_banco||x.topico})}
  if(p.arvore)pac.arvore=p.arvore;if(p.resumos)pac.resumos=p.resumos;if(p.lista_mestra)pac.lista=p.lista_mestra;if(p.agregados)pac.agregados=p.agregados;
  pac.atualizado=Date.now();
  if(p.questoes){const porId=Object.fromEntries(db.added.map((q,i)=>[q.id,i]));
    const porAt=Object.fromEntries(pac.atomos.map(a=>[a.id,a]));(pac.atomos||[]).forEach(a=>(a.aliases||[]).forEach(al=>{porAt[al]=porAt[al]||a}));

/* ---------- regras do grafo na montagem da sessão ---------- */
function questaoDoAtomo(id,pool,excluir){id=resolverAtomo(id);const c=pool.filter(q=>!excluir.has(q.id)&&(q.atomos||[]).some(l=>resolverAtomo(l.id)===id));if(!c.length)return null;

  const vezes=q=>(db.u&&db.u.bq[q.id]||{}).n||0;
  c.sort((a,b)=>{const la=a.atomos.find(l=>resolverAtomo(l.id)===id),lb=b.atomos.find(l=>resolverAtomo(l.id)===id);
    return((lb.papel==="decide")-(la.papel==="decide"))||((lb.tipo_cobranca!==ultTipo)-(la.tipo_cobranca!==ultTipo))||(vezes(a)-vezes(b))});

  const agora=Date.now(),max=Math.max(1,Math.round(meta*EST_CFG.maxRegras)),extras=[],pares=[];
  for(const x of picks){if(extras.length>=max)break;const at=atomoDecide(x.q);if(!at)continue;
    for(const r of relsDe(at.id)){if(extras.length>=max)break;
      if(r.tipo==="prerequisito"&&!r.souA){const pre=r.outro;if(selAt.has(pre))continue;if(estadoAtomo(pre,p,agora).dominio>=EST_CFG.fraco)continue;
        const q=questaoDoAtomo(pre,pool,sel);if(!q)continue;extras.push({q,antesDe:x.q.id,motivo:"pré-requisito: "+rotuloAtomo(pre)});sel.add(q.id);selAt.set(pre,q.id)}
      else if(r.tipo==="confusao"&&(r.forca||0)>=EST_CFG.confusaoMin){const par=r.outro;

        const q=questaoDoAtomo(par,pool,sel);if(!q)continue;extras.push({q,motivo:"par de confusão: "+rotuloAtomo(par)});sel.add(q.id);selAt.set(par,q.id);pares.push({a:x.q.id,b:q.id,pista:r.pista||"",eixo:r.eixo||""})}}}
  if(!extras.length)return{picks,pares};
  let lista=picks.slice();
  extras.forEach(e=>{const it={q:e.q,P:0.5,R:0.5,visto:!!ATOM_HIST[(atomoDecide(e.q)||{}).id],motivo:e.motivo,regra:true};
    const i=e.antesDe?lista.findIndex(x=>x.q.id===e.antesDe):-1;if(i>=0)lista.splice(i,0,it);else lista.push(it)});

  for(let i=lista.length-1;i>=0&&lista.length>meta;i--){if(!lista[i].regra&&!/termômetro/.test(lista[i].motivo||""))lista.splice(i,1)}

function resumoEstrutura(S){if(!temEstrutura()||!S.att||!S.att.length)return null;const p=S.projId?db.projetos.find(x=>x.id===S.projId):null;

function segPorQuestao(){

  const s=db.sessoes.filter(x=>x.ms&&x.n>=5).slice(-5);if(s.length)return Math.max(20,Math.round(s.reduce((x,y)=>x+y.ms/y.n,0)/s.length/1000));

function gerarCronograma(p){
  const g={m:p.materias.filter(x=>x.pref<0),n:p.materias.filter(x=>!x.pref),g:p.materias.filter(x=>x.pref>0)};
  const seq=[];const L=Math.max(g.m.length,g.n.length,g.g.length);
  for(let i=0;i<L;i++){if(g.m[i])seq.push(g.m[i]);if(g.g[i])seq.push(g.g[i]);if(g.n[i])seq.push(g.n[i])}
  seq.push(...g.m);   /* as que menos gosta aparecem uma vez a mais por ciclo */
  if(!seq.length)return[];
  const blocos=(db.cfg.neuroPlano&&db.cfg.neuroPlano.umaMateriaDia)?1:p.minDia>=90?3:p.minDia>=50?2:1,out=[];let ci=0;
  const hoje=new Date();hoje.setHours(0,0,0,0);
  for(let d=0;d<p.semanas*7;d++){const dt=new Date(hoje.getTime()+d*864e5);if(!p.dias.includes(dt.getDay()))continue;
    const usados=new Set();
    for(let b=0;b<blocos;b++){let m=seq[ci%seq.length];ci++;let t=0;while(usados.has(m.nome)&&t<seq.length){m=seq[ci%seq.length];ci++;t++}
      usados.add(m.nome);out.push({id:"c"+d+"_"+b,data:isoDe(dt),mat:m.nome,k:m.k||null,min:Math.round(p.minDia/blocos),feito:0})}}
  return out}

function montarSimulado(s){

  if(s.banca)l=l.filter(q=>(q.banca||"")===s.banca);

  if(s.cargo)l=l.filter(q=>normTxt(q.cargo||"").includes(normTxt(s.cargo))||!q.cargo);
  const sel=s.sel?(s.sel instanceof Set?s.sel:new Set(s.sel)):new Set();
  if(sel.size)l=l.filter(q=>sel.has("t:"+q.tema)||sel.has("a:"+q.tema+"|"+aspOf(q))||sel.has("s:"+q.tema+"|"+aspOf(q)+"|"+q.subtema));
  else{if(s.temas&&s.temas.length)l=l.filter(q=>s.temas.includes(q.tema));
  if(s.asps&&s.asps.length)l=l.filter(q=>s.asps.includes(aspOf(q)));
  if(s.assuntos&&s.assuntos.length)l=l.filter(q=>s.assuntos.includes(q.subtema));}

  if(s.foco==="erra")l=l.filter(q=>{const t=db.stats[q.id];return t&&t.t&&t.a/t.t<0.6});

  if(s.compl==="diretas")l=l.filter(q=>q.enun.length<280);if(s.compl==="complexas")l=l.filter(q=>q.enun.length>=280);

  p.ajustes=p.ajustes||{retencao:p.retencao||0.8,fadiga:"normal",espacamento:"padrao"};
  const pr=progProj(p),at=atrasados(p),sl=proxSlot(p),h=hojeISO(),aba=st.projAba||"agenda";
  const units=p.materias.filter(m=>m.k),venc=revisoesVencidas(units),dAte=diasAteProva(p),mf=melhorFaixa(),seq=sequenciaDias();
  const calib=(p.calib||0)<MC.calibracao.sessoes,modo=(p.ponto||0)>MC.foco.sugerirQ||p.dias.length<=MC.foco.sugerirFreq?"foco intenso":"padrão";
  const provaTxt=p.dataProva?(p.provaMes?"prova em "+p.dataProva.slice(5,7)+"/"+p.dataProva.slice(0,4):"prova "+fmtData(p.dataProva)):"";
  const linha=s=>`<div class="dia ${s.feito?"ok":s.data<h?"atr":""}"><span class="d">${fmtData(s.data)}${s.data<h&&!s.feito?" · atrasado":""}</span><span class="m">${esc(s.mat)} <span class="meta">${s.minutos?s.minutos.join("+"):s.min} min${s.remarcado?" · remarcado":""}</span></span>
    ${s.feito?'<span class="st-b">✓</span>':`<button class="sm" data-act="slotIniciar" data-id="${p.id}" data-s="${s.id}" ${s.k?"":"disabled"}>Estudar</button><button class="sm" data-act="slotFeito" data-id="${p.id}" data-s="${s.id}">Concluído</button>`}</div>`;
  let corpo="";
  if(aba==="agenda")corpo=`<div class="card"><b>Hoje</b> <span class="meta">· ${sl?esc(sl.mat)+(sl.data!==h?" (de "+fmtData(sl.data)+")":""):"nada programado"}</span>
      <div class="meta">Meta: ${calib?"calibração ("+((p.calib||0)+1)+"/"+MC.calibracao.sessoes+")":(p.alvo||MC.meta.padrao)+" questões"}${p.ponto?` · ponto de partida ${p.ponto}`:""} · revisões vencidas: <b>${venc}</b> · modo sugerido: ${modo}${dAte!==null?` · faltam <b>${dAte}</b> dias`:""}${mf!==null?` · melhor horário: ${nomeFaixa(mf)}`:""} · sequência: ${seq} dia(s)</div>
      <div class="acoes"><button class="primary" data-act="projContinuar" data-id="${p.id}" ${sl?"":"disabled"}>Continuar${sl?": "+esc(sl.mat):""}</button><button class="sm" data-act="ics" data-id="${p.id}">Exportar agenda (.ics)</button>${st.replanejar?`<button class="sm primary" data-act="replanejar" data-id="${p.id}">Replanejar a partir de hoje</button>`:""}</div></div>
    <div class="card sessao"><div class="prog"><i style="width:${pr.pct}%"></i></div>
      <div class="meta">${pr.f}/${pr.t} sessões concluídas${at?` · <span class="st-r">${at} atrasada(s)</span>`:""} · ${p.materias.length} unidades de estudo · ${[...p.dias].sort().map(i=>SEMANA[i]+" "+((p.minPorDia||{})[i]||p.minDia)+"′").join(", ")}</div></div>
    ${U4()?(()=>{const epc=epcProjeto(p);if(!epc)return "";return `<div class="card"><b>Estimativa para a prova (EPC)</b> ${epc.epc!==undefined?`<span class="meta">· acerto esperado <b>${epc.epc}%</b>, faixa ${epc.p10}–${epc.p90}%, com ${epc.n} respostas${epc.chance!==null?` · chance de ficar acima do corte de ${p.corte}%: <b>${epc.chance}%</b> (inclui ±${MC.unificado.epc.sdProva} pontos de variação do dia da prova)`:" · informe a nota de corte em Alvos para ver a chance de aprovação"}</span>`:`<span class="meta">· disponível após ${epc.faltam} respostas a mais (mínimo ${MC.unificado.epc.minRespostas})</span>`}
      <p class="meta">Média ponderada pelos temas da chance de acerto hoje (lembrar × passar a barra + chutar). Não é nota oficial: a conversão para a escala da prova exige notas reais.</p></div>`})():""}
    <h3>Próximas sessões</h3>${projPend(p).sort((a,b)=>a.data<b.data?-1:1).slice(0,5).map(linha).join("")||'<p class="meta">Nada pendente.</p>'}`;
  else if(aba==="org"){const porD={};units.forEach(u=>(porD[u.k]=porD[u.k]||[]).push(u));
    const todas=poolDe(units),eg=estat(todas);
    corpo=`<div class="card"><b>Geral</b>: ${eg.n?Math.round(eg.f*100/eg.n):0}% das ${eg.n} questões já vistas · acerto ${eg.pct===null?"—":eg.pct+"%"} · ${pr.pct}% do cronograma<div class="prog"><i style="width:${eg.n?Math.round(eg.f*100/eg.n):0}%"></i></div>
      <p class="meta"><span class="st-b">verde</span> bem estudado (≥${LIMITE}%, revisto há até 21 dias) · <span class="st-r">vermelho</span> acerto baixo ou revisão vencida · <span class="st-n">cinza</span> não visto. Toque numa matéria para abrir temas, e num tema para abrir os assuntos.</p></div>`
      +Object.entries(porD).map(([k,us])=>{const l=poolDe(us),e=estat(l),g=grupos(k);
        const temas=us.map(u=>u.tema).filter(Boolean).length?us.map(u=>u.tema).filter(t=>g[t]):Object.keys(g).sort();
        return `<details class="card"><summary><b>${DISC[k]}</b> <span class="meta">· ${e.n?Math.round(e.f*100/e.n):0}% percorrido (${e.f}/${e.n}) · acerto ${e.pct===null?"—":e.pct+"%"} · ${temas.length} tema(s)</span><div class="prog"><i style="width:${e.n?Math.round(e.f*100/e.n):0}%"></i></div></summary>
          ${temas.map(t=>{const lt=Object.values(g[t]).flat(),et=estat(lt),[c,tx]=statusTopico(lt),lac=lacuna(lt);
            return `<details style="margin:6px 0 6px 10px"><summary><b>${esc(t)}</b> <span class="meta">· ${et.f}/${et.n} vistas · <span class="st-${c}">${tx}</span>${lac?' · <span class="st-r">'+lac+' lacuna(s)</span>':""}</span></summary>
              ${Object.keys(g[t]).sort().map(s=>{const ls=g[t][s],es=estat(ls),[c2,tx2]=statusTopico(ls),sn=statusNo("sub",subtopicoDe(ls[0]));
                return `<div class="lin" style="margin-left:10px"><span class="nome">${esc(s)} <span class="meta">${[...new Set(ls.map(aspOf))].filter(x=>x!=="Sem aspecto").map(esc).join(", ")}${sn.nivel?" · "+sn.nivel:""}</span></span><span class="meta">${es.f}/${es.n} · <span class="st-${c2}">${tx2}</span></span>${bar(es)}<button class="sm" data-act="ideiasAsp" data-t="${esc(topicoDe(ls[0]))}">Ideias</button></div>`}).join("")}</details>`}).join("")}</details>`}).join("")
      +p.materias.filter(m=>!m.k).map(m=>`<div class="card"><b>${esc(m.nome)}</b> <span class="meta">· sem questões no banco: acompanhamento só pelo cronograma</span></div>`).join("")}
  else if(aba==="erros"){const pool=poolDe(units),ids=new Set(pool.map(q=>q.id));
    const att=db.attempts.filter(a=>ids.has(a.q));
    const porQ={};att.forEach(a=>{const x=porQ[a.q]||(porQ[a.q]={q:a.q,t:0,e:0});x.t++;if(!a.ok||a.ch)x.e++});
    const freq=Object.values(porQ).filter(x=>x.e>=1).sort((a,b)=>b.e-a.e||b.t-a.t).slice(0,15);
    const porT={};pool.forEach(q=>{const k=temaDe(q);(porT[k]=porT[k]||{k,nome:DISC[q.disc]+" › "+q.tema,ids:[]}).ids.push(q.id)});
    const temas=Object.values(porT).map(t=>{const l=att.filter(a=>t.ids.includes(a.q));const n=l.length,e=l.filter(a=>!a.ok||a.ch).length;return{...t,n,e,acc:n?Math.round((n-e)*100/n):null}}).filter(t=>t.n>=MC.janela.subtopico[1]).sort((a,b)=>a.acc-b.acc);
    const insuf=temas.filter(t=>t.acc<MC.niveis[1][1]);
    const pri=U4()?prioridadesDoPool(pool):[],al=U4()?alertasQueda(pool):[];
    corpo=`${al.length?`<div class="card aviso-card"><b>Queda súbita</b> <span class="meta">· acerto do dia mais de 2 desvios abaixo da média móvel do tema</span>${al.map(a=>`<div class="lin"><span class="nome">${esc(a.nome)}</span><span class="meta">${Math.round(a.acc*100)}% em ${a.dia.slice(5)} · média ${Math.round(a.media*100)}%</span><button class="sm" data-act="revTema" data-k="${esc(a.tk)}">Revisar agora</button></div>`).join("")}</div>`:""}
    ${pri.length?`<div class="card"><b>Prioridade por tema (0–100)</b> <span class="meta">· lacuna até 40 · esquecimento até 35 · peso na prova até 25</span>${pri.slice(0,10).map(x=>`<div class="lin"><span class="nome">${esc(x.nome)}</span><span class="meta"><b>${x.total}</b> · lacuna ${x.lacuna} · esquecimento ${x.esquecimento} · peso ${x.peso} · retenção ${Math.round(x.R*100)}%</span>${bar({pct:x.total})}</div>`).join("")}</div>`:""}
    <div class="card"><b>Temas com insuficiência</b> <span class="meta">· acurácia abaixo de ${MC.niveis[1][1]}% com pelo menos ${MC.janela.subtopico[1]} respostas</span>
      ${insuf.length?insuf.map(t=>`<div class="lin"><span class="nome">${esc(t.nome)}</span><span class="meta"><span class="st-r">${t.acc}%</span> · ${t.e} erros em ${t.n}</span>${bar({pct:t.acc})}<button class="sm" data-act="revTema" data-k="${esc(t.k)}">Revisar</button></div>`).join(""):'<p class="meta">Nenhum tema abaixo do corte ainda.</p>'}</div>
      <h3>Questões que você mais erra</h3>${freq.length?freq.map(x=>{const q=POR_ID[x.q];if(!q)return"";return `<div class="lin"><span class="nome"><span class="cod">${q.cod}</span><span>${esc(q.enun.slice(0,70))}…</span></span><span class="meta">${esc(q.tema)} › ${esc(q.subtema)} · <span class="st-r">${x.e}</span> erro(s) em ${x.t}</span><button class="sm" data-act="praticarUma" data-id="${esc(q.id)}">Refazer</button></div>`}).join(""):'<p class="meta">Sem erros registrados neste projeto.</p>'}
      <h3>Todos os temas (pior ao melhor)</h3>${temas.map(t=>`<div class="lin"><span class="nome">${esc(t.nome)}</span><span class="meta">${t.acc}% (${t.n-t.e}/${t.n})</span>${bar({pct:t.acc})}</div>`).join("")||'<p class="meta">Faça algumas sessões para aparecer.</p>'}`}
  else if(aba==="cron"){const pend=projPend(p).sort((a,b)=>a.data<b.data?-1:1);
    corpo=`<h3>Pendentes (${pend.length})</h3>${pend.slice(0,40).map(linha).join("")||'<p class="meta">Nada pendente.</p>'}${pend.length>40?`<p class="meta">… e mais ${pend.length-40}.</p>`:""}
      <details class="card"><summary>Concluídos (${pr.f})</summary>${(p.cronograma||[]).filter(s=>s.feito).sort((a,b)=>a.data<b.data?1:-1).map(linha).join("")}</details>`}
  else corpo=`<div class="card"><h3 style="margin-top:0">Alvos do projeto</h3><p class="meta">Pré-definidos pelo objetivo; mude quando quiser. Valem para as próximas sessões.</p>
      <label><span>Retenção-alvo</span><select data-ch="pj_retencao"><option value="0.8"${p.ajustes.retencao==0.8?" selected":""}>80% (padrão)</option><option value="0.9"${p.ajustes.retencao==0.9?" selected":""}>90% (exigente)</option></select></label>
      <label><span>Alerta de fadiga</span><select data-ch="pj_fadiga">${[["normal","Normal: avisa pelos gatilhos e pela binomial"],["sensivel","Sensível: avisa mais cedo"],["off","Desligado: só registra, não interrompe"]].map(([v,t])=>`<option value="${v}"${p.ajustes.fadiga===v?" selected":""}>${t}</option>`).join("")}</select></label>
      <label><span>Repetição espaçada</span><select data-ch="pj_espacamento">${[["padrao","Padrão: 1 → 3 → 7 → 14 → 30 → 60 → 120 dias"],["curto","Curta: intervalos 30% menores"],["longo","Longa: intervalos 30% maiores"]].map(([v,t])=>`<option value="${v}"${p.ajustes.espacamento===v?" selected":""}>${t}</option>`).join("")}</select></label>
      <label><span>Banca-alvo (opcional: a importância das afirmações passa a pesar o que essa banca cobra)</span><input data-ch="pj_banca" list="bancasAlvo" value="${esc(p.banca||"")}" placeholder="Ex.: ABP, SES-RJ"><datalist id="bancasAlvo">${[...new Set(QS.map(q=>q.banca).filter(Boolean))].sort().map(b=>`<option>${esc(b)}</option>`).join("")}</datalist></label>
      <label><span>Nota de corte da prova (% de acertos; opcional, só se for oficial)</span><input type="number" min="0" max="100" data-ch="pj_corte" value="${p.corte||""}" placeholder="—" style="width:110px"></label>
      <label><span>Minutos por dia (padrão para dias sem valor próprio)</span><input type="number" min="10" data-ch="pj_minDia" value="${p.minDia}" style="width:110px"></label>
      <div class="acoes"><button data-act="projExcluir" data-id="${p.id}">Excluir projeto</button></div></div>`;
  return `<div class="topo">${voltar("projetos",0,"Projetos")}<h2>${esc(p.nome)}</h2><span class="meta">${provaTxt}</span></div>
    <div class="aba">${[["agenda","Agenda"],["org","Organograma"],["erros","Erros"],["cron","Cronograma"],["alvos","Alvos"]].map(([k,t])=>`<button data-act="projAba" data-k="${k}" aria-selected="${aba===k}">${t}</button>`).join("")}</div>
    ${corpo}${msgBox()}`}
function vSimulados(){
  const s=st.sim;
  const lista=db.simulados.slice().reverse().map(sm=>{const ult=(sm.res||[]).slice(-1)[0];
    return `<div class="lin"><span class="nome"><span><b>${esc(sm.nome)}</b><br><span class="meta">${sm.ids.length} questões · ${[sm.spec.cargo,sm.spec.banca,sm.spec.ano,sm.spec.dur?sm.spec.dur+" min":"",(sm.spec.sel&&sm.spec.sel.length)?sm.spec.sel.length+" tema(s)/assunto(s)":""].filter(Boolean).map(esc).join(" · ")}${ult?` · último: ${ult.ac}/${ult.n} (${ult.data})`:" · nunca feito"}</span></span></span>
      <button class="sm primary" data-act="simRefazer" data-id="${sm.id}">${ult?"Refazer":"Fazer"}</button><button class="sm" data-act="simExcluir" data-id="${sm.id}">Excluir</button></div>`}).join("");
  let form="";
  if(s){const base=QS.filter(q=>!s.discs.size||s.discs.has(q.disc));
    const arvore={};base.forEach(q=>{const t=arvore[q.tema]=arvore[q.tema]||{n:0,asp:{}};t.n++;const a=t.asp[aspOf(q)]=t.asp[aspOf(q)]||{n:0,ass:{}};a.n++;a.ass[q.subtema]=(a.ass[q.subtema]||0)+1});
    const cb=(k,label,n)=>`<label style="display:inline-flex;align-items:center;gap:6px;margin:0"><input type="checkbox" data-act="simSel" data-k="${esc(k)}" ${s.sel.has(k)?"checked":""}> ${esc(label)} <span class="meta">(${n})</span></label>`;
    const picker=Object.keys(arvore).sort().map(t=>`<div class="lin" style="display:block"><div style="display:flex;gap:8px;align-items:center">${cb("t:"+t,t,arvore[t].n)}<button class="sm" data-act="simExp" data-k="${esc(t)}">${s.exp.has(t)?"−":"+"}</button></div>
      ${s.exp.has(t)?Object.keys(arvore[t].asp).sort().map(a=>`<div style="margin:4px 0 0 22px"><div style="display:flex;gap:8px;align-items:center">${cb("a:"+t+"|"+a,a,arvore[t].asp[a].n)}<button class="sm" data-act="simExp" data-k="${esc(t+"|"+a)}">${s.exp.has(t+"|"+a)?"−":"+"}</button></div>
        ${s.exp.has(t+"|"+a)?Object.keys(arvore[t].asp[a].ass).sort().map(x=>`<div style="margin:3px 0 0 22px">${cb("s:"+t+"|"+a+"|"+x,x,arvore[t].asp[a].ass[x])}</div>`).join(""):""}</div>`).join(""):""}</div>`).join("");
    const bancas=[...new Set(QS.map(q=>q.banca).filter(Boolean))].sort(),anos=[...new Set(QS.map(q=>String(q.ano||"")).filter(Boolean))].sort(),idi=idiomas();
    const n=montarSimulado({...s,discs:[...s.discs],sel:s.sel,qtd:0}).length;
    form=`<div class="card"><h3 style="margin-top:0">Novo simulado</h3>
      <div class="row"><label><span>Nome</span><input data-f="simNome" value="${esc(s.nome)}" placeholder="Ex.: Simulado residência nº 1"></label>
        <label><span>Cargo / objetivo</span><input data-f="simCargo" value="${esc(s.cargo)}" placeholder="Ex.: médico legista"></label></div>
      <p class="meta" style="margin:8px 0 4px">Matérias (nenhuma marcada = todas):</p>
      <div>${Object.keys(DISC_VIS()).map(k=>`<span class="chip ${s.discs.has(k)?"on":""}" data-act="simDisc" data-k="${k}">${DISC[k]}</span>`).join("")}</div>
      <div class="row" style="margin-top:8px"><label><span>Banca</span><select data-f="simBanca"><option value="">Todas</option>${bancas.map(x=>`<option${s.banca===x?" selected":""}>${esc(x)}</option>`).join("")}</select></label>
        <label><span>Ano</span><select data-f="simAno"><option value="">Todos</option>${anos.map(x=>`<option${s.ano===x?" selected":""}>${esc(x)}</option>`).join("")}</select></label>
        ${idi.length?`<label><span>Idioma</span><select data-f="simIdioma"><option value="">Todos</option>${idi.map(x=>`<option${s.idioma===x?" selected":""}>${esc(x)}</option>`).join("")}</select></label>`:""}</div>
      <p class="meta" style="margin:10px 0 4px">Temas (nenhum marcado = todos). Marque o tema inteiro ou abra com + e escolha só um subtema (aspecto) ou um assunto:</p>
      <div style="max-height:320px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:4px 10px">${picker||'<p class="meta">Sem questões nas matérias marcadas.</p>'}</div>
      <div class="row"><label><span>Foco</span><select data-f="simFoco">${[["","Todas as questões"],["revisar","A revisar (vencidas e não vistas)"],["erra","As que mais erro"],["nao","Nunca vistas"]].map(([v,t])=>`<option value="${v}"${s.foco===v?" selected":""}>${t}</option>`).join("")}</select></label>
        <label><span>Enunciado</span><select data-f="simCompl">${[["","Todos"],["diretas","Diretas (curtas)"],["complexas","Complexas (casos longos)"]].map(([v,t])=>`<option value="${v}"${s.compl===v?" selected":""}>${t}</option>`).join("")}</select></label>
        <label><span>Dificuldade (pelo seu histórico)</span><select data-f="simDif">${[["","Todas"],["faceis","Fáceis (acerto ≥70%)"],["dificeis","Difíceis (acerto <50%)"]].map(([v,t])=>`<option value="${v}"${s.dif===v?" selected":""}>${t}</option>`).join("")}</select></label></div>
      <div class="row"><label><span>Quantidade</span><input type="number" min="1" data-f="simQtd" value="${s.qtd||""}" placeholder="todas (${n})"></label>
        <label><span>Tempo</span><select data-f="simDur"><option value="0">Sem cronômetro</option>${[10,20,30,60,90,120].map(m=>`<option value="${m}"${s.dur===m?" selected":""}>${m} min</option>`).join("")}</select></label>
        <label><span>Resposta</span><select data-f="simProva"><option value="0"${s.prova?"":" selected"}>Na hora</option><option value="1"${s.prova?" selected":""}>Só no final (prova)</option></select></label>
        <label><span>Modo</span><select data-f="simUma"><option value="0"${s.umaQ?"":" selected"}>Lista corrida</option><option value="1"${s.umaQ?" selected":""}>Uma por vez</option></select></label></div>
      <p class="meta"><b>${n}</b> questão(ões) atendem aos filtros. <button class="sm" data-act="simAtualizar">Atualizar contagem</button></p>
      <div class="acoes"><button class="primary" data-act="simCriar" ${n?"":"disabled"}>Criar e começar</button><button data-act="simCancelar">Cancelar</button></div></div>`}
  return `<div class="topo">${voltar("menu",0,"Menu")}<h2>Simulados</h2>${s?"<span></span>":'<button class="sm primary" data-act="simNovo">+ Novo simulado</button>'}</div>
    ${form}<h3>Anteriores (${db.simulados.length})</h3>${lista||'<p class="meta">Nenhum simulado criado ainda.</p>'}${msgBox()}`}

function vRevisarQ(){
  const f=st.revF||{};
  const proj=f.proj?db.projetos.find(x=>x.id===f.proj):null;
  const dentro=q=>proj?proj.materias.some(m=>m.k&&matFiltro(m)(q)):(!f.disc||q.disc===f.disc);
  const erra=QS.filter(q=>dentro(q)&&!incompleta(q)&&(()=>{const t=db.stats[q.id];return t&&t.t&&t.a/t.t<0.6})());
  const porD={};erra.forEach(q=>{(porD[q.disc]=porD[q.disc]||{});(porD[q.disc][q.tema]=porD[q.disc][q.tema]||[]).push(q)});
  const blocos=Object.keys(porD).map(d=>`<details class="card" open><summary><b>${DISC[d]}</b> <span class="meta">· ${Object.values(porD[d]).flat().length} questão(ões) erradas</span> <button class="sm primary" data-act="revSessao" data-d="${d}">Sessão da matéria</button></summary>
      ${Object.keys(porD[d]).sort().map(t=>`<div class="lin"><span class="nome">${esc(t)} <span class="meta">· ${porD[d][t].length} erradas · assuntos: ${[...new Set(porD[d][t].map(q=>q.subtema))].slice(0,4).map(esc).join(", ")}</span></span><button class="sm" data-act="revSessao" data-d="${d}" data-t="${esc(t)}">Sessão do tema</button></div>`).join("")}</details>`).join("");
  const nF=db.flags.length,nNS=QS.filter(q=>{const a=db.stats[q.id]&&db.stats[q.id].av;return a&&(a.naosabia||a.chute)}).length,nInc=QS.filter(faltaDado).length,nRev=QS.filter(q=>dentro(q)&&pred.revisar(q)).length;

  const idxs=st.umaQ?[S.cur]:S.lista.map((_,i)=>i);
  const cards=idxs.filter(i=>S.lista[i]).map(i=>{
    const q=S.lista[i],resp=S.resp[i],pick=S.esc[i],nr=relAbertos(q.cod).length,sq=db.stats[q.id]||{};

        if(v>1)res+=`<div class="meta">Você já marcou esta mesma alternativa ${v} vezes nesta questão.</div>`}
      res+=botoesConf(i,S)+feedbackIdeia(q,i,S)}
    return `<section class="card" id="qc${i}">
      <div class="meta"><span class="cod">${q.cod}</span> · ${DISC[q.disc]} › <b>${esc(q.tema)}</b> › ${esc(q.subtema)}
        ${q.cargo?`<span class="tag">${esc(q.cargo)}</span>`:""}${fonteTag(q)}${q.orig?`<span class="tag">prova nº ${q.orig}</span>`:(q.banca?"":q.origemTipo==="revisao"?'<span class="tag">revisão (IA)</span>':'<span class="tag">própria</span>')}
        ${db.edits[q.id]?'<span class="tag e">editada</span>':""}${nr?`<span class="tag r">${nr} relato${nr>1?"s":""}</span>`:""}</div>
      ${S.motivos&&S.motivos[q.id]?`<div class="meta" style="margin:-4px 0 6px">Por que esta questão: ${esc(S.motivos[q.id])}</div>`:""}
      ${q.base?`<div class="tbase">${esc(q.base)}</div>`:""}<div class="enun">${esc(q.enun)}</div>
      ${figsTag(q)}
      ${ehDisc(q)?blocoDisc(q):`${chipsDificuldade(i,S)}${opts}${res}${fb&&q.gab?`<div class="gab">Gabarito: ${LET[q.opcoes.findIndex(o=>o.c)]}</div>`:""}`}
      ${acoesQ(q)}</section>`}).join("");
  const nav=st.umaQ&&n?`<div class="acoes" style="justify-content:space-between;align-items:center">
      <button data-act="navQ" data-d="-1" ${S.cur<=0?"disabled":""}>← Anterior</button>
      <span class="meta">${S.cur+1} de ${n}</span>
      <button class="primary" data-act="navQ" data-d="1" ${S.cur>=n-1?"disabled":""}>Próxima →</button></div>`:"";
  const ctxLine=(S.ctx?`<div class="meta" style="margin:-4px 0 10px"><b>${esc(S.ctx)}</b>${S.motor&&S.meta?` · meta ${Math.min(r,S.meta)}/${S.meta}`:""}${S.calib?" · calibração":""}</div>`:"")+cardAviso(S)+cardPausa(S)+cardCheckpoint(S);
  if(S.pausa&&!S.encerrada){const p=relatorio();
    return head+ctxLine+`<div class="card sessao"><b>Parcial: ${p.ac} acertos em ${p.resp} respondidas (${p.pct}%)</b>
      <p class="meta">Média de ${fmtMs(p.tMed)} por questão. Faltam ${n-r} questões.</p>
      ${p.temas.map(t=>`<div class="lin"><span class="nome">${esc(t.sub)} <span class="meta">(${esc(t.tema)})</span></span><span class="meta">${t.pct}% (${t.a}/${t.n})</span>${bar({pct:t.pct})}</div>`).join("")}
      <div class="acoes"><button class="primary" data-act="continuarSessao">Continuar</button><button data-act="encerrar">Encerrar e ver relatório</button></div></div>`+msgBox()}
  return head+ctxLine+(n?cards+nav:`<p class="empty">Sessão vazia.</p>`)+msgBox()}

/* botões que aparecem na questão (na sessão e no banco): rever, não sei, comentário, problema, editar */
function acoesQ(q,compacto){
  const nt=db.notas[q.id]||{};
  return `<div class="acoes"><button class="sm" data-act="flag" data-id="${esc(q.id)}">${db.flags.includes(q.id)?"🚩 Rever depois":"⚑ Rever depois"}</button>
      <button class="sm" data-act="coment" data-id="${esc(q.id)}">💬 ${nt.txt?"Comentário":"Comentar"}</button>
      <button class="sm" data-act="rep" data-cod="${q.cod}">⚠ Problema</button>
      ${compacto||(q.pub&&!ehAdmin())?"":`<button class="sm" data-act="edit" data-id="${esc(q.id)}">✎ Editar</button>`}</div>
    ${resumoAv(q)?`<div class="meta" style="margin-top:6px">Autoavaliação registrada: ${esc(resumoAv(q))}</div>`:""}
    ${nt.txt&&st.comQ!==q.id?`<div class="meta" style="margin-top:6px">💬 ${esc(nt.txt)}</div>`:""}
    ${st.comQ===q.id?`<div class="card" style="margin:10px 0 0;background:var(--bg)"><label><span>Comentário sobre ${q.cod}</span><textarea data-f="comTxt" style="min-height:70px">${esc(st.form.comTxt!==undefined?st.form.comTxt:(nt.txt||""))}</textarea></label>
      <div class="acoes"><button class="primary sm" data-act="comSalvar" data-id="${esc(q.id)}">Salvar</button><button class="sm" data-act="comFechar">Fechar</button></div></div>`:""}

function formRelato(q){

    <label><span>Tipo de problema na questão ${q.cod}</span>
      <select data-f="repTipo">${Object.keys(TIPOS).map(k=>`<option value="${k}"${st.form.repTipo===k?" selected":""}>${TIPOS[k]}</option>`).join("")}</select></label>
    <label><span>Descrição (o que está errado e, se souber, qual seria o certo)</span>
      <textarea data-f="repTxt" placeholder="Ex.: o enunciado diz 'Muller Fisher', o correto é 'Miller Fisher'. Ou: o gabarito deveria ser C.">${esc(st.form.repTxt||"")}</textarea></label>
    <div class="acoes"><button class="primary sm" data-act="repSalvar" data-cod="${q.cod}">Enviar relato</button>
      <button class="sm" data-act="repFechar">Cancelar</button></div></div>`}

function vStats(){
  const porD=Object.keys(DISC_VIS()).map(d=>{const e=estat(QS.filter(q=>q.disc===d));
    return `<div class="lin"><span class="nome"><b>${DISC[d]}</b></span>
      <span class="meta">${txtPct(e)} · ${e.f}/${e.n} respondidas</span>${bar(e)}</div>`}).join("");
  const L=[],M=[];
  Object.keys(DISC_VIS()).forEach(d=>{const g=grupos(d);
    Object.keys(g).forEach(t=>Object.keys(g[t]).forEach(s=>{const e=estat(g[t][s]);M.push({d,t,s,e});if(e.t)L.push({d,t,s,e})}))});
  L.sort((x,y)=>x.e.pct-y.e.pct);
  M.sort((x,y)=>(x.e.pct===null?999:x.e.pct)-(y.e.pct===null?999:y.e.pct));
  const todas=estat(QS),mediaGlobal=(todas.pct===null?70:todas.pct)/100;

  const lin=x=>`<div class="lin"><span class="nome"><span><b>${esc(x.s)}</b><br><span class="meta">${DISC[x.d]} › ${esc(x.t)}</span></span></span>

  const cnt={};QS.forEach(q=>{const s=db.stats[q.id];if(s&&s.c)Object.entries(s.c).forEach(([k,v])=>cnt[k]=(cnt[k]||0)+v)});
  const totC=Object.values(cnt).reduce((a,b)=>a+b,0);
  const causasHtml=totC?Object.keys(CAUSAS).map(k=>{const v=cnt[k]||0,p=Math.round(v*100/totC);
    return `<div class="lin"><span class="nome">${CAUSAS[k]}</span><span class="meta">${v} (${p}%)</span>${bar({pct:p})}</div>`}).join("")
    :'<p class="meta">Ainda sem causas registradas. Ao errar uma questão, escolha o motivo ali mesmo.</p>';

    if(!Ls.length)return `<div class="lin"><span class="nome"><b>${f} min</b></span><span class="meta">sem sessões ainda</span></div>`;
    const tot=Ls.reduce((a,s)=>a+s.n,0),ac=Ls.reduce((a,s)=>a+s.ac,0),med=tot/Ls.length;
    return `<div class="lin"><span class="nome"><b>${f} min</b> <span class="meta">· ${Ls.length} sessão(ões)</span></span>
      <span class="meta">em média <b>${med.toFixed(1)}</b> questões · acerto ${tot?Math.round(ac*100/tot):0}% · ≈ ${(f*60/med).toFixed(0)} s por questão</span></div>`}).join("");

    <h3>Subtemas que merecem mais atenção (abaixo de ${LIMITE}%)</h3>
    ${pri.length?pri.map(lin).join(""):`<p class="meta">Nenhum subtema abaixo de ${LIMITE}% com pelo menos 2 respostas.</p>`}
    <h3>Todos os subtemas respondidos (pior ao melhor)</h3>
    ${L.length?L.map(lin).join(""):'<p class="meta">Nenhuma resposta registrada ainda.</p>'}
    <h3>Armadilhas recorrentes — o mesmo distrator escolhido 2 vezes ou mais</h3>
    ${arm.length?arm.map(x=>`<div class="card"><div class="meta"><span class="cod">${x.q.cod}</span> · ${esc(x.q.tema)} › ${esc(x.q.subtema)} — marcada ${x.n} vezes</div>
      <div style="margin:5px 0">${esc(x.q.enun.slice(0,130))}…</div>
      <div class="res err">Você insiste em: ${esc(x.alt)}</div>
      <div class="meta">Correta: ${esc(x.q.alts[LET.indexOf(x.q.gab)]||"")}</div>
      <div class="acoes"><button class="sm" data-act="praticarUma" data-id="${esc(x.q.id)}">Refazer</button>
        <button class="sm" data-act="edit" data-id="${esc(x.q.id)}">Editar</button></div></div>`).join("")
      :'<p class="meta">Nenhuma ainda. Esta lista aparece quando você erra a mesma questão escolhendo sempre a mesma alternativa.</p>'}
    ${db.cfg.conf?`<h3>Acertos no chute — não conte como domínio</h3>
    ${ch.length?ch.map(q=>{const s=db.stats[q.id];
      return `<div class="lin"><span class="nome"><span><span class="cod">${q.cod}</span> ${esc(q.subtema)}<br><span class="meta">${esc(q.tema)}</span></span></span>
        <span class="meta">${s.gc} acerto(s) no chute em ${s.g} chute(s)</span>
        <button class="sm" data-act="praticarUma" data-id="${esc(q.id)}">Refazer</button></div>`}).join("")
      :'<p class="meta">Nenhum acerto marcado como chute.</p>'}`:""}
    <p class="meta" style="margin-top:14px">Questões ainda não respondidas: ${QS.filter(q=>!db.stats[q.id]).length}</p>${msgBox()}`}

/* ============ captura de formulários ============ */
function colher(){document.querySelectorAll("[data-f]").forEach(el=>{
  const k=el.dataset.f,v=el.type==="checkbox"?el.checked:el.multiple?[...el.selectedOptions].map(o=>o.value):el.value;
  if(k==="qtd")st.qtd=v;else if(k==="busca")st.busca=v;else st.form[k]=v})}

function baixar(nome,txt,tipo){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([txt],{type:tipo||"text/plain;charset=utf-8"}));
  a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function copiar(t){if(navigator.clipboard)navigator.clipboard.writeText(t).catch(()=>{})}

function lerSim(){const s=st.sim,f=st.form;if(!s)return;
  if(f.simNome!==undefined)s.nome=f.simNome.trim();if(f.simCargo!==undefined)s.cargo=f.simCargo.trim();
  if(f.simBanca!==undefined)s.banca=f.simBanca;if(f.simAno!==undefined)s.ano=f.simAno;if(f.simIdioma!==undefined)s.idioma=f.simIdioma;

  if(f.simFoco!==undefined)s.foco=f.simFoco;if(f.simCompl!==undefined)s.compl=f.simCompl;if(f.simDif!==undefined)s.dif=f.simDif;
  if(f.simQtd!==undefined)s.qtd=parseInt(f.simQtd,10)||0;if(f.simDur!==undefined)s.dur=+f.simDur||0;
  if(f.simProva!==undefined)s.prova=f.simProva==="1";if(f.simUma!==undefined)s.umaQ=f.simUma==="1"}
/* ============ ações ============ */

  if(a==="conf"){marcarConfianca(+el.dataset.q,el.dataset.v);return}
  if(a==="conf2"){marcarConf(+el.dataset.q,el.dataset.v);return}
  {const r=acaoEstrutura(a,el);if(r==="feito")return;if(r){gravar();render();return}}
  switch(a){
    case "enviarLink":enviarLink();break;
    case "confirmarCodigo":confirmarCodigo();break;
    case "sair":sair();break;
    case "paraRevisar":case "revisar":st.view="revisar";st.msg="";break;
    case "home":st.view="home";st.msg="";break;
    case "disc":st.view="disc";st.disc=el.dataset.d;st.tema=null;st.asp=null;st.sel=new Set();st.msg="";break;
    case "stats":st.view="stats";st.msg="";break;
    case "banco":st.view="banco";st.msg="";break;
    case "relatos":st.view="relatos";st.msg="";break;
    case "dados":st.view="dados";st.msg="";break;
    case "add":st.view="add";st.msg="";break;
    case "aba":st.abaAdd=el.dataset.k;st.msg="";break;

    case "tsel":{const g=grupos(st.disc)[el.dataset.k]||{};
      Object.keys(g).forEach(s=>{const k=chave(el.dataset.k,s);el.checked?st.sel.add(k):st.sel.delete(k)});break}
    case "ssel":{const k=el.dataset.k;el.checked?st.sel.add(k):st.sel.delete(k);break}
    case "praticar":st.sel=new Set([el.dataset.k]);return iniciar(selecionadas(st.disc));
    case "praticarPri":st.disc=el.dataset.d;st.sel=new Set([el.dataset.k]);st.filtro="todas";return iniciar(selecionadas(st.disc));
    case "iniciar":return iniciar(selecionadas(st.disc));
    case "glob":st.disc=null;st.sel=new Set();st.filtro="todas";st.msg="";return iniciar(QS.filter(pred[el.dataset.f]),0);
    case "menu":if(st.neuro){clearTimeout(st.neuro._t);st.neuro=null}st.view="menu";st.msg="";break;
    case "trocarCargo":db.cfg.cargo=el.dataset.k;gravar();construir();st.view="home";break;
    case "config":st.view="dados";st.msg="";break;
    case "entrar":st.view="entrar";st.msg="";break;
    case "loginModo":st.loginModo=el.dataset.k;st.msg="";break;
    case "entrarSenha":entrarSenha();return;
    case "criarConta":criarConta();return;
    case "esqueciSenha":esqueciSenha();return;
    case "salvarNovaSenha":salvarNovaSenha();return;
    case "excluirConta":pedir("Excluir sua conta apaga todas as questões, o progresso e as figuras na nuvem, sem volta. Faça um backup antes.",()=>excluirConta(),"Excluir tudo");return;
    case "admin":st.view="admin";st.msg="";break;
    case "adminCarregar":adminCarregar();return;
    case "adminExportar":adminExportar();return;

    case "copiarModelo":copiar(MODELO_LOTE);st.msg="Modelo copiado.";break;

    /* backup */
    case "exportar":{
      const usadas=QS.map(q=>q.fig).filter(f=>f&&f.startsWith("img:")).map(f=>f.slice(4));
      Promise.all(usadas.map(k=>imgGet(k).then(v=>[k,v]))).then(pares=>{

    case "importar":{
      let x;try{x=JSON.parse(st.form.imp||"")}catch(err){st.msg="Arquivo inválido: "+err.message;break}
      if(!x||typeof x!=="object"){st.msg="Arquivo inválido.";break}
      (x.added||[]).forEach(q=>{if(!db.added.some(y=>y.id===q.id)){q.seq=++db.seq;db.added.push(q)}});
      Object.assign(db.edits,x.edits||{});
      (x.reports||[]).forEach(r=>{if(!db.reports.some(y=>y.cod===r.cod&&y.txt===r.txt))db.reports.push(r)});
      Object.entries(x.stats||{}).forEach(([k,v])=>{const c=db.stats[k];if(!c||v.t>c.t)db.stats[k]=v});
      Object.entries(x.sched||{}).forEach(([k,v])=>{if(!db.sched[k])db.sched[k]=v});
      db.flags=[...new Set(db.flags.concat(x.flags||[]))];
      (x.sessoes||[]).forEach(s=>{if(!db.sessoes.some(y=>y.id===s.id))db.sessoes.push(s)});
      if(x.cfg)db.cfg=Object.assign(db.cfg,x.cfg);
      (x.projetos||[]).forEach(p=>{if(!db.projetos.some(y=>y.id===p.id))db.projetos.push(p)});
      (x.simulados||[]).forEach(p=>{if(!db.simulados.some(y=>y.id===p.id))db.simulados.push(p)});
      (x.atencao||[]).forEach(p=>db.atencao.push(p));
      (x.neuro||[]).forEach(p=>{if(!db.neuro.some(y=>y.ts===p.ts))db.neuro.push(p)});
      (x.attempts||[]).forEach(a=>{if(!db.attempts.some(y=>y.fim===a.fim&&y.q===a.q))db.attempts.push(a)});db.attempts.sort((a,b)=>a.fim-b.fim);
      Object.entries(x.ideias||{}).forEach(([k,v])=>{if(!db.ideias[k])db.ideias[k]=v});
      Object.entries(x.faixas||{}).forEach(([k,v])=>{if(!db.faixas[k])db.faixas[k]=v});construirAtt();
      Object.entries(x.notas||{}).forEach(([k,v])=>{if(!db.notas[k])db.notas[k]=v});
      Object.entries(x.imgs||{}).forEach(([k,v])=>{imgPut(k,v).catch(()=>{});IMGC.set(k,v)});
      gravar();construir();st.form.imp="";st.msg="Backup importado e mesclado.";break}
    case "praticarUma":{const q=POR_ID[el.dataset.id];st.disc=q.disc;st.sel=new Set();st.filtro="todas";return iniciar([q])}
    case "imgLimpar":{const k=st.form[el.dataset.alvo]||"";
      if(k.startsWith("img:")){imgDel(k.slice(4)).catch(()=>{});IMGC.delete(k.slice(4))}

    case "temaCor":{const o=["","light","dark"];db.cfg.tema=o[(o.indexOf(db.cfg.tema||"")+1)%3];gravar();break}
    case "cron":st.disc=null;st.sel=new Set();st.filtro="todas";return iniciar(QS.slice(),+el.dataset.m);
    case "retomar":{const S=sessaoAtiva();if(!S)break;st.view="quiz";iniciarRelogio();
      if(S.fim&&Date.now()>=S.fim){encerrarSessao("tempo");return}break}
    case "descartar":pedir("Descartar a sessão em andamento? As respostas já dadas continuam no histórico.",()=>{st.S=S_VAZIA();limparSessaoSalva();render()},"Descartar");return;
    case "causa":{const S=st.S,i=+el.dataset.q,k=el.dataset.k,q=S.lista[i];

    case "umaQ":st.umaQ=!st.umaQ;break;
    case "telaCheia":{const de=document.documentElement;

  }

async function lerNuvem(){
  const {data:p,error:e1}=await sb.from("progresso").select("dados").eq("user_id",usuario.id).maybeSingle();
  if(e1)throw e1;
  let linhas=[],ini=0;

    const {data,error}=await sb.from("questoes").select("id,dados").eq("user_id",usuario.id).order("id").range(ini,ini+999);
    if(error)throw error;
    linhas=linhas.concat(data||[]);

  const pr=c.progresso||{};
  Object.assign(db,{stats:pr.stats||{},sched:pr.sched||{},flags:pr.flags||[],reports:pr.reports||[],edits:pr.edits||{},

  db.added=c.linhas.map(r=>({...r.dados,id:r.id}));

async function salvarNuvem(){
  if(!sb||!usuario||!nuvem.carregado)return;
  if(!navigator.onLine){setSync("pendente");return}
  try{
    const pj=JSON.stringify(progDe(db));
    if(pj!==progSalvo){const {error}=await sb.from("progresso").upsert({user_id:usuario.id,dados:progDe(db)});if(error)throw error;progSalvo=pj}
    const vistos=new Set(),mudar=[];
    for(const q of db.added){vistos.add(q.id);const j=JSON.stringify(q);
      if(ultimoSalvo.get(q.id)!==j)mudar.push({user_id:usuario.id,id:q.id,dados:q,_j:j})}
    for(let i=0;i<mudar.length;i+=400){
      const {error}=await sb.from("questoes").upsert(mudar.slice(i,i+400).map(({_j,...r})=>r));if(error)throw error}
    mudar.forEach(r=>ultimoSalvo.set(r.id,r._j));
    for(const id of [...ultimoSalvo.keys()])if(!vistos.has(id)){
      const {error}=await sb.from("questoes").delete().eq("id",id);if(error)throw error;ultimoSalvo.delete(id)}
    await sincronizarFiguras();setSync("ok")
  }catch(e){setSync("pendente")}}

  st.adminDados=data||[];st.msg="";render()}
function adminExportar(){if(!st.adminDados)return;baixar("usuarios_"+hojeISO()+".json",JSON.stringify({exportado:new Date().toISOString(),usuarios:st.adminDados},null,1),"application/json")}
async function sair(){
  if(!st.saidaConfirmada){pedir("Sair deste aparelho? Confira que o indicador no canto mostra 'sincronizado'.",()=>{st.saidaConfirmada=true;sair()},"Sair");return}
  if(sb)await sb.auth.signOut().catch(()=>{});
  try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+"_sessao");localStorage.removeItem(KEY+"_added");localStorage.removeItem(KEY+"_figs")}catch(e){}
  try{await kvPut("added",[])}catch(e){}
  try{const ks=await imgKeys();for(const k of ks)await imgDel(k)}catch(e){}
  location.reload()}

function vEntrar(){const modo=st.loginModo||"entrar";
  const areaSel=`<label><span>Área</span><select data-f="cargoLogin">${[["","— escolha —"]].concat(Object.entries(AREAS)).map(([v,t])=>`<option value="${v}"${(st.form.cargoLogin||db.cfg.cargo||"")===v?" selected":""}${v&&!AREAS_ATIVAS.includes(v)?" disabled":""}>${t}${v&&!AREAS_ATIVAS.includes(v)?" (em breve)":""}</option>`).join("")}</select></label>`;
  return `<div class="card" style="max-width:420px;margin:40px auto">
    <div class="aba" style="margin-bottom:12px">${[["entrar","Entrar"],["criar","Criar conta"],["esqueci","Esqueci a senha"]].map(([k,t])=>`<button data-act="loginModo" data-k="${k}" aria-selected="${modo===k}">${t}</button>`).join("")}</div>
    ${modo==="criar"?areaSel:""}
    <label><span>E-mail</span><input type="email" data-f="emailLogin" value="${esc(st.form.emailLogin||"")}" autocomplete="email"></label>
    ${modo!=="esqueci"?`<label><span>Senha${modo==="criar"?" (mínimo 6 caracteres)":""}</span><input type="password" data-f="senhaLogin" value="${esc(st.form.senhaLogin||"")}" autocomplete="${modo==="criar"?"new-password":"current-password"}"></label>`:""}
    ${modo==="criar"?`<p class="meta">Ao criar a conta, o app guarda seu e-mail, sua área e seu histórico de estudo para funcionar e sincronizar entre aparelhos. Você pode exportar ou excluir tudo em Configurações.</p>`:""}
    <div class="acoes"><button class="primary" data-act="${modo==="entrar"?"entrarSenha":modo==="criar"?"criarConta":"esqueciSenha"}">${modo==="entrar"?"Entrar":modo==="criar"?"Criar conta":"Enviar link de redefinição"}</button></div>
    ${msgBox()}<div class="acoes"><button class="sm" data-act="home">← Voltar sem entrar</button></div></div>`}
function vNovaSenha(){return `<div class="card" style="max-width:420px;margin:40px auto"><h2 style="margin-top:0">Nova senha</h2>
    <p class="meta">${usuario?"Conta "+esc(usuario.email||""):""} · escolha a nova senha (mínimo 6 caracteres).</p>
    <label><span>Nova senha</span><input type="password" data-f="senhaNova" value="${esc(st.form.senhaNova||"")}" autocomplete="new-password"></label>
    <label><span>Repita</span><input type="password" data-f="senhaNova2" value="${esc(st.form.senhaNova2||"")}" autocomplete="new-password"></label>
    <div class="acoes"><button class="primary" data-act="salvarNovaSenha">Salvar senha</button></div>${msgBox()}</div>`}
async function entrarSenha(){const email=String(st.form.emailLogin||"").trim(),senha=String(st.form.senhaLogin||"");
  if(!/^\S+@\S+\.\S+$/.test(email)){st.msg="Digite um e-mail válido.";render();return}
  if(!sb){st.msg="Sem conexão com o servidor. Tente de novo com internet.";render();return}
  const {data,error}=await sb.auth.signInWithPassword({email,password:senha});
  if(error||!data||!data.session){st.msg=/invalid/i.test((error&&error.message)||"")?"E-mail ou senha incorretos.":"Não consegui entrar: "+((error&&error.message)||"tente de novo");render();return}
  st.form.senhaLogin="";st.msg="";await entrarComSessao(data.session.user);render()}
async function criarConta(){const email=String(st.form.emailLogin||"").trim(),senha=String(st.form.senhaLogin||""),cargo=st.form.cargoLogin||db.cfg.cargo;
  if(!cargo){st.msg="Escolha a área antes de criar a conta.";render();return}
  if(!/^\S+@\S+\.\S+$/.test(email)){st.msg="Digite um e-mail válido.";render();return}
  if(senha.length<6){st.msg="A senha precisa ter pelo menos 6 caracteres.";render();return}
  if(!sb){st.msg="Sem conexão com o servidor.";render();return}
  const {data,error}=await sb.auth.signUp({email,password:senha,options:{data:{cargo}}});
  if(error){st.msg=/registered/i.test(error.message)?"Este e-mail já tem conta. Use Entrar ou Esqueci a senha.":"Não consegui criar a conta: "+error.message;render();return}
  db.cfg.cargo=cargo;gravar();st.form.senhaLogin="";
  if(data&&data.session){st.msg="";await entrarComSessao(data.session.user);render()}
  else{st.loginModo="entrar";st.msg="Conta criada. Confirme pelo link que chegou no e-mail e depois entre com a senha.";render()}}
async function esqueciSenha(){const email=String(st.form.emailLogin||"").trim();
  if(!/^\S+@\S+\.\S+$/.test(email)){st.msg="Digite um e-mail válido.";render();return}
  if(!sb){st.msg="Sem conexão com o servidor.";render();return}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  st.msg=error?"Não consegui enviar: "+error.message:"Enviei um link para "+email+". Abra-o: ele traz você de volta ao app para escolher a nova senha. No iPhone instalado, o link abre no Safari; defina a senha lá e depois entre no app com ela.";render()}
async function salvarNovaSenha(){const a=String(st.form.senhaNova||""),b=String(st.form.senhaNova2||"");
  if(a.length<6){st.msg="A senha precisa ter pelo menos 6 caracteres.";render();return}
  if(a!==b){st.msg="As duas senhas não coincidem.";render();return}
  const {error}=await sb.auth.updateUser({password:a});
  if(error){st.msg="Não consegui salvar: "+error.message;render();return}
  st.form.senhaNova="";st.form.senhaNova2="";st.view="home";st.msg="Senha alterada.";render()}
